<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:#f4f4f0;color:#1a1a1a;min-height:100vh;padding:1.5rem 1rem}
.wrap{max-width:740px;margin:0 auto}
h1{font-size:1.35rem;font-weight:700;margin-bottom:0.25rem}

.stat{background:#fff;border-radius:10px;padding:0.65rem 0.4rem;text-align:center;border:1px solid #e8e8e8}

.badge{font-size:0.68rem;padding:2px 8px;border-radius:20px;background:#f2f2f2;color:#666;border:1px solid #e0e0e0}

.qtext{font-size:0.92rem;line-height:1.72;margin-bottom:0.9rem;white-space:pre-wrap}
.code{background:#1e1e2e;color:#cdd6f4;font-family:monospace;font-size:0.78rem;padding:0.85rem;border-radius:8px;margin:0.4rem 0 0.9rem;overflow-x:auto;white-space:pre;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:7px}

.opt:hover:not(:disabled){background:#f0f5ff;border-color:#8fb5fd}
.opt.ok{background:#e8f5e9;border-color:#43a047;color:#1b5e20;font-weight:600}
.opt.ng{background:#ffebee;border-color:#e53935;color:#b71c1c}
.opt.hi{background:#fff8e1;border-color:#ffa000}

.explain{margin-top:0.75rem;padding:0.65rem 0.9rem;background:#f0f7ff;border-left:3px solid #1455b5;border-radius:0 8px 8px 0;font-size:0.8rem;color:#333;line-height:1.65}
.nav{display:flex;justify-content:space-between;align-items:center;margin:1.1rem 0}
.nbtn{padding:0.5rem 1.3rem;border-radius:8px;border:1.5px solid #ccc;background:#fff;cursor:pointer;font-size:0.86rem;color:#333;font-family:inherit;transition:all .12s}
.nbtn:hover:not(:disabled){background:#f0f0f0}
.nbtn:disabled{opacity:.35;cursor:default}
.nbtn.pr{background:#1455b5;border-color:#1455b5;color:#fff;font-weight:600}
.nbtn.pr:hover:not(:disabled){background:#0d47a1}
.pinfo{font-size:0.8rem;color:#aaa}
#rarea{display:none}
.rbox{background:#fff;border-radius:13px;padding:1.4rem;margin-bottom:1rem;border:1px solid #e8e8e8}
.rscore{text-align:center;padding:1rem 0}
.rnum{font-size:2.8rem;font-weight:800;color:#1455b5}
.rsub{font-size:0.88rem;color:#888;margin-top:4px}
.verdict{text-align:center;padding:0.6rem 1rem;border-radius:8px;font-size:0.86rem;margin-top:0.8rem;font-weight:500}
.vp{background:#e8f5e9;color:#2a7d32;border:1px solid #a5d6a7}
.vf{background:#ffebee;color:#c62828;border:1px solid #ef9a9a}
.wtitle{font-size:0.95rem;font-weight:700;margin-bottom:0.9rem;padding-bottom:0.5rem;border-bottom:2px solid #ffcdd2}
.witem{border-left:3px solid #e53935;padding:0.75rem 0.9rem;margin-bottom:0.75rem;background:#fff9f9;border-radius:0 8px 8px 0}
.wq{font-size:0.82rem;color:#1a1a1a;margin-bottom:0.35rem;line-height:1.5}
.wa{font-size:0.76rem;color:#666;margin-top:3px}
.wex{font-size:0.73rem;color:#777;margin-top:5px;line-height:1.5}
.rbtn{display:block;width:100%;padding:0.75rem;border-radius:10px;background:#1455b5;color:#fff;border:none;font-size:0.92rem;font-weight:600;cursor:pointer;margin-top:0.8rem;font-family:inherit}
.rbtn:hover{background:#0d47a1}
</style>

<script>
const Q=[
// 제1과목 소프트웨어 설계
{n:1,s:"소프트웨어 설계",q:"프로토타이핑 모델(Prototyping Model)에 대한 설명으로 옳지 않은 것은?",o:["최종 결과물이 만들어지기 전에 의뢰자가 최종 결과물의 일부를 미리 볼 수 있다.","프로토타이핑을 수행하는 과정에서 새로운 요구사항의 발견을 어렵게 한다.","프로토타입은 반드시 사용자와 개발자 모두에게 공통의 참조 모델을 제공한다.","프로토타입은 구현 단계에서 구현 공정이 되는 결과이다."],a:1,e:"프로토타이핑은 수행 과정에서 새로운 요구사항의 발견을 용이하게 한다."},
{n:2,s:"소프트웨어 설계",q:"자료 흐름도(DFD)의 각 요소별 표기 형태의 연결이 옳지 않은 것은?",o:["Process : 원","Data Flow : 화살표","Data Store : 삼각형","Terminator : 사각형"],a:2,e:"Data Store(데이터 저장소)는 삼각형이 아닌 평행선(두 줄)으로 표기한다."},
{n:3,s:"소프트웨어 설계",q:"HIPO(Hierarchy Input Process Output)에 대한 설명으로 가장 거리가 먼 것은?",o:["상업용 소프트웨어 개발을 위한 문서화 도구이다.","HIPO 차트 종류에는 가시적 도표, 총체적 도표, 세부적 도표가 있다.","기능과 자료의 의존 관계를 동시에 표현할 수 있다.","보기 쉽고 이해하기 쉽다."],a:0,e:"HIPO는 상업용 소프트웨어 전용 도구가 아닌 시스템 설계 및 문서화를 위한 일반적 도구이다."},
{n:4,s:"소프트웨어 설계",q:"그래픽 표기법을 이용하여 소프트웨어 구성 요소를 모델링하는 객체지향 분석 기법에 포함되지 않는 것은?",o:["객체 모델링","기능 모델링","동적 모델링","정적 모델링"],a:3,e:"럼바우(Rumbaugh)의 객체지향 분석 3가지 모델링은 객체, 동적, 기능 모델링이다. 정적 모델링은 포함되지 않는다."},
{n:5,s:"소프트웨어 설계",q:"다음 내용이 설명하는 객체지향 설계 원칙은?\n\n- 클라이언트는 사용하지 않는 메소드와 의존관계를 맺으면 안 된다.\n- 클라이언트가 사용하지 않는 인터페이스 때문에 영향을 받아서는 안 된다.",o:["인터페이스 분리 원칙","단일 책임 원칙","개방 폐쇄의 원칙","리스코프 교체의 원칙"],a:0,e:"ISP(Interface Segregation Principle): 클라이언트는 자신이 사용하지 않는 인터페이스에 의존하면 안 된다."},
{n:6,s:"소프트웨어 설계",q:"N-S(Nassi-Schneiderman) Chart에 대한 설명으로 거리가 먼 것은?",o:["논리의 기술에 중점을 둔 도형식 표현 방법이다.","연속, 선택 및 다중 선택, 반복 등의 제어 논리 구조로 표현한다.","주로 화살표를 사용하여 논리적인 제어 구조로 흐름을 표현한다.","이해하기 쉽고 코드 변환이 용이하다."],a:2,e:"N-S 차트는 화살표를 사용하지 않고 박스(직사각형) 형태로 표현한다."},
{n:7,s:"소프트웨어 설계",q:"럼바우(Rumbaugh)의 객체지향 분석 절차를 가장 바르게 나열한 것은?",o:["객체 모델링 → 동적 모델링 → 기능 모델링","객체 모델링 → 기능 모델링 → 동적 모델링","기능 모델링 → 동적 모델링 → 객체 모델링","기능 모델링 → 객체 모델링 → 동적 모델링"],a:0,e:"럼바우 분석 절차: 객체(Object) 모델링 → 동적(Dynamic) 모델링 → 기능(Function) 모델링"},
{n:8,s:"소프트웨어 설계",q:"한 모듈 내의 각 구성 요소들이 공통의 목적을 달성하기 위하여 서로 얼마나 관련이 있는지의 기능적 연결 정도를 나타내는 것은?",o:["Cohesion","Coupling","Structure","Unity"],a:0,e:"응집도(Cohesion)는 모듈 내부 요소들의 기능적 연관 정도를 나타낸다."},
{n:9,s:"소프트웨어 설계",q:"결합도(Coupling) 단계를 약한 순서에서 강한 순서로 가장 올바르게 표시한 것은?",o:["Control → Data → Stamp → Common → Content","Stamp → Control → Data → Common → Content","Content → Stamp → Control → Common → Data","Data → Stamp → Control → Common → Content"],a:3,e:"결합도 약 → 강 순서: Data < Stamp < Control < External < Common < Content"},
{n:10,s:"소프트웨어 설계",q:"UML에서 시퀀스 다이어그램의 구성 항목에 해당하지 않는 것은?",o:["생명선","실행","확장","메시지"],a:2,e:"시퀀스 다이어그램 구성: 생명선(Lifeline), 실행(Activation), 메시지(Message), 객체(Object). 확장(Extend)은 유스케이스 다이어그램의 관계이다."},
{n:11,s:"소프트웨어 설계",q:"멀티 터치(Multi-touch), 동작 인식(Gesture Recognition) 등 자연스러운 입력 방식으로 정보를 교류하는 사용자 인터페이스를 의미하는 것은?",o:["GUI(Graphical User Interface)","OUI(Organic User Interface)","NUI(Natural User Interface)","CLI(Command Line Interface)"],a:2,e:"NUI(Natural User Interface): 동작 인식 등 자연스러운 입력 방식으로 상호작용하는 UI."},
{n:12,s:"소프트웨어 설계",q:"LOC 기법에 의하여 예측된 총 라인수가 36000라인, 참여할 프로그래머가 6명, 평균 생산성이 월당 300라인일 때 소요 기간은?",o:["5개월","10개월","15개월","20개월"],a:3,e:"월 생산량 = 6명 × 300라인 = 1800라인/월. 소요 기간 = 36000 ÷ 1800 = 20개월"},
{n:13,s:"소프트웨어 설계",q:"분산 시스템에서 미들웨어(Middleware)와 관련한 설명으로 틀린 것은?",o:["분산 시스템에서 다양한 부분을 관리하고 통신하며 데이터를 교환해 주는 소프트웨어로 볼 수 있다.","위치 투명성(Location Transparency)을 제공한다.","분산 시스템의 여러 컴퓨터들이 요구하는 재사용 가능한 서비스의 구현을 제공한다.","애플리케이션과 사용자 사이에서만 분산 서비스를 제공한다."],a:3,e:"미들웨어는 애플리케이션-사용자 간뿐만 아니라 이기종 시스템 간 통신과 데이터 교환을 지원한다."},
{n:14,s:"소프트웨어 설계",q:"객체에게 어떤 행위를 하도록 지시하는 명령은?",o:["Class","Package","Object","Message"],a:3,e:"Message: 객체 간에 상호 작용을 하는 수단으로, 객체에게 어떤 행위를 하도록 지시하는 명령이다."},
{n:15,s:"소프트웨어 설계",q:"애자일 소프트웨어 개발 기법의 가치가 아닌 것은?",o:["프로세스와 도구보다는 개인과 상호작용에 더 가치를 둔다.","계약 협상보다는 고객과의 협업에 더 가치를 둔다.","실제 작동하는 소프트웨어보다 이해하기 좋은 문서에 더 가치를 둔다.","계획을 따르기보다는 변화에 대응하는 것에 더 가치를 둔다."],a:2,e:"애자일은 포괄적 문서보다 실제 작동하는 소프트웨어를 더 가치 있게 여긴다."},
{n:16,s:"소프트웨어 설계",q:"GoF(Gangs of Four) 디자인 패턴의 구조 패턴에 속하지 않는 것은?",o:["Composite","Observer","Adapter","Decorator"],a:1,e:"Observer는 행위(Behavioral) 패턴이다. 구조 패턴: Adapter, Bridge, Composite, Decorator, Facade, Flyweight, Proxy"},
{n:17,s:"소프트웨어 설계",q:"UML에 대한 설명으로 옳지 않은 것은?",o:["OMG에서 만든 통합 모델링 언어로서 객체 지향적 분석, 설계 방법론의 표준 지정을 목표로 한다.","애플리케이션을 개발할 때 여러 가지 유형의 다이어그램을 제공한다.","실시간 시스템 및 분산 시스템과 같은 시스템의 분석과 설계에는 사용할 수 없다.","개발자와 고객 또는 개발자 상호 간의 의사 소통을 원활하게 할 수 있다."],a:2,e:"UML은 실시간 시스템, 분산 시스템 등 다양한 시스템의 분석과 설계에도 사용할 수 있다."},
{n:18,s:"소프트웨어 설계",q:"미들웨어(Middleware)에 대한 설명으로 틀린 것은?",o:["운영체제에서 응용 프로그램들 사이에 위치한 소프트웨어이다.","미들웨어의 서비스 이용을 위해 사용자가 내부 동작을 잘 확인할 수 있어야 한다.","소프트웨어 컴포넌트를 이용할 수 있는 인프라 구조를 제공한다.","컴포넌트를 1대 1, 1대 다, 다대 다 등 여러 가지 형태로 연결이 가능하다."],a:1,e:"미들웨어는 내부 동작을 숨기고 표준화된 인터페이스를 통해 서비스를 제공하는 것이 핵심이다."},
{n:19,s:"소프트웨어 설계",q:"럼바우(Rumbaugh)의 객체지향 분석 기법 중 자료 흐름도(DFD)를 주로 이용하는 것은?",o:["기능 모델링","동적 모델링","객체 모델링","정적 모델링"],a:0,e:"기능 모델링(Functional Modeling): DFD를 사용하여 데이터 흐름을 표현한다."},
{n:20,s:"소프트웨어 설계",q:"모듈화를 통해 분리된 시스템의 각 기능들로, 서브루틴, 서브시스템, 소프트웨어 내의 프로그램, 작업 단위 등과 같은 의미로 사용되는 것은?",o:["Module","Component","Things","Prototype"],a:0,e:"모듈(Module): 모듈화를 통해 분리된 시스템의 각 기능 단위."},
// 제2과목 소프트웨어 개발
{n:21,s:"소프트웨어 개발",q:"ISO/IEC 9126의 소프트웨어 품질 특성 중 기능성(Functionality)의 하위 특성으로 옳지 않은 것은?",o:["학습성","적합성","정확성","보안성"],a:0,e:"학습성(Learnability)은 기능성이 아닌 사용성(Usability)의 하위 특성이다. 기능성 하위특성: 적합성, 정확성, 상호 운용성, 보안성, 호환성"},
{n:22,s:"소프트웨어 개발",q:"SW 패키징 도구 활용 시 고려사항과 거리가 먼 것은?",o:["패키징 시 사용자를 고려하여 보안을 고려한다.","사용자 편의성을 위한 복잡한 기능과 비효율성 문제를 고려한다.","사용성 단일 기기에서만 사용할 수 있도록 해야 한다.","제품 SW종류에 적합한 암호화 알고리즘을 적용한다."],a:2,e:"SW 패키징은 다양한 기기에서 사용 가능하도록 고려해야 한다."},
{n:23,s:"소프트웨어 개발",q:"하향식 통합에 있어서 모듈 간의 통합 시험을 위해 일시적으로 필요한 조건들을 가지고 임시로 제공되는 시험용 모듈을 무엇이라고 하는가?",o:["Stub","Driver","Procedure","Function"],a:0,e:"Stub: 하향식 통합 시 하위 모듈 대신 사용하는 더미 모듈. Driver: 상향식 통합 시 상위 모듈 대신 사용하는 더미 모듈."},
{n:24,s:"소프트웨어 개발",q:"소프트웨어 재공학이 소프트웨어의 재개발에 비해 갖는 장점으로 옳은 것은?",o:["위험부담 감소","비용 절감","시스템 명령의 오류 억제","개발 기간 단축"],a:3,e:"소프트웨어 재공학은 기존 소프트웨어를 활용하므로 새로 개발하는 것보다 개발 기간이 단축된다."},
{n:25,s:"소프트웨어 개발",q:"제품 소프트웨어의 형상 관리 역할로 틀린 것은?",o:["형상 관리를 통해 이전 리비전이나 버전에 대한 정보에 접근 가능하여 여러 곳에 관리에 유용","불필요한 사용자의 소스 수정 제한","프로젝트 개발비용을 효율적으로 관리","동일한 프로젝트에 대해 여러 개발자가 동시 개발 가능"],a:2,e:"형상 관리는 비용 관리 도구가 아닌 변경 사항 관리 및 버전 통제 도구이다."},
{n:26,s:"소프트웨어 개발",q:"다음 제어흐름 그래프에서 McCabe's cyclomatic 수(복잡도)는?\n(노드 4개, 간선 6개인 그래프)",o:["3","4","5","6"],a:1,e:"McCabe's cyclomatic 수 = E - N + 2 = 6 - 4 + 2 = 4"},
{n:27,s:"소프트웨어 개발",q:"디지털 저작권 관리(DRM) 기능과 거리가 먼 것은?",o:["콘텐츠 암호화 및 키 관리","콘텐츠 식별체계 표현","콘텐츠 오류 감지 및 복구","라이선스 발급 및 관리"],a:2,e:"콘텐츠 오류 감지 및 복구는 DRM의 기능이 아닌 오류 복구(Error Recovery) 기능에 해당한다."},
{n:28,s:"소프트웨어 개발",q:"테스트의 결과가 참인지 거짓인지를 판단하기 위해서 사전에 정의된 참값을 입력하여 비교하는 기준 및 활동을 말하며, 종류에는 참, 샘플링, 휴리스틱, 일관성 검사가 있는 것은?",o:["테스트 케이스","테스트 시나리오","테스트 오라클","테스트 데이터"],a:2,e:"테스트 오라클(Test Oracle): 테스트 결과가 올바른지 판단하기 위해 사전에 정의된 기준. 종류: 참 오라클, 샘플링 오라클, 휴리스틱 오라클, 일관성 검사 오라클."},
{n:29,s:"소프트웨어 개발",q:"다음 트리에 대한 INORDER 운행 결과는?\n\n      A\n     / \\\n    B   C\n   /   / \\\n  D   E   F",o:["D B A E C F","A B D C E F","D B E C F A","A B C D E F"],a:0,e:"INORDER(중위 순회): 왼쪽 → 루트 → 오른쪽. 순서: D → B → A → E → C → F"},
{n:30,s:"소프트웨어 개발",q:"검증(Validation) 검사 기법 중 개발자의 장소에서 사용자가 개발자 앞에서 행해지며, 오류와 문제점을 사용자와 개발자가 함께 확인하면서 실시하는 검사는?",o:["디버깅 검사","형상 검사","자료구조 검사","알파 검사"],a:3,e:"알파 검사(Alpha Test): 개발자 환경에서 사용자가 직접 테스트하며 개발자가 관찰하는 인수 테스트 방식."},
{n:31,s:"소프트웨어 개발",q:"해싱 함수(Hashing Function)의 종류가 아닌 것은?",o:["제곱법(Mid-Square)","숫자 분석법(Digit Analysis)","개방주소법(Open Addressing)","제산법(Division)"],a:2,e:"개방주소법(Open Addressing)은 해싱의 충돌(Collision) 해결 방법이며, 해싱 함수의 종류가 아니다."},
{n:32,s:"소프트웨어 개발",q:"퀵 정렬에 관한 설명으로 옳은 것은?",o:["레코드의 키 값을 분석하여 같은 값끼리 그 순서에 맞는 버킷에 분배하였다가 버킷의 순서에 따라 꺼내어 정렬한다.","주어진 파일에서 인접한 두 개의 레코드 키 값을 비교하여 그 크기에 따라 레코드 위치를 서로 교환한다.","레코드의 많은 자료 이동을 없애고 하나의 파일을 부분적으로 나누어 가면서 정렬하는 방법이다.","입력 파일이 어떤 상태이더라도 일정한 탐색 시간을 보장한다."],a:2,e:"퀵 정렬(Quick Sort): 피봇을 기준으로 파일을 부분적으로 나누면서 정렬. ①은 버킷 정렬, ②는 버블 정렬, ④는 이진 탐색."},
{n:33,s:"소프트웨어 개발",q:"소프트웨어 설치 매뉴얼에 포함될 항목이 아닌 것은?",o:["제품 소프트웨어 개요","설치 관련 파일","폴더 및 설치 경로","소프트웨어 개발 기간"],a:3,e:"소프트웨어 개발 기간은 개발 관련 정보로 설치 매뉴얼에 포함되지 않는다. 설치 매뉴얼 포함 항목: 설치 관련 파일, 설치 경로, 매뉴얼 개요, 이상 증상 처리 등."},
{n:34,s:"소프트웨어 개발",q:"다음 단위 테스트로 발견할 수 있는 오류가 아닌 것은?",o:["알고리즘 오류에 따른 잘못된 결과","탈출구가 없는 반복문의 존재","모듈의 비정상적인 상호 작용으로 인한 원치 않는 결과","틀린 연산 우선순위로 인한 잘못된 결과"],a:2,e:"모듈 간 상호 작용 오류는 단위 테스트가 아닌 통합 테스트에서 발견한다."},
{n:35,s:"소프트웨어 개발",q:"다음이 설명하는 소프트웨어 버전 관리 도구 방식은?\n\n- 버전 관리 자료가 원격 저장소와 로컬 저장소에 함께 저장되어 관리된다.\n- 원격 저장소에 문제가 생겨도 로컬 저장소의 자료를 이용하여 작업할 수 있다.\n- 대표적인 버전 관리 도구로 Git이 있다.",o:["단일 장소 보관 방식","분산 저장소 방식","공유 폴더 방식","클라이언트-서버 방식"],a:1,e:"분산 저장소 방식: 원격 저장소와 로컬 저장소 모두 관리. 대표 도구: Git."},
{n:36,s:"소프트웨어 개발",q:"다음 중 최악의 경우 탐색 검색 시간이 가장 느린 트리 구조는?",o:["이진 탐색 트리","AVL 트리","2-3 트리","레드-블랙 트리"],a:0,e:"이진 탐색 트리(BST)는 최악의 경우(편향 트리) O(n)이다. AVL, 2-3, 레드-블랙 트리는 균형 트리로 O(log n)을 보장한다."},
{n:37,s:"소프트웨어 개발",q:"코드의 간결성을 유지하기 위해 사용하는 지침으로 틀린 것은?",o:["공백을 이용하여 설명 그룹과 구분을 명확히 구분한다.","복잡한 논리식과 산술식은 들여쓰기(Indentation)를 통해 명확히 표현한다.","빈 줄을 사용하여 선언부와 구현부를 구분한다.","한 줄에 최대한 많은 문장을 코드화한다."],a:3,e:"한 줄에 여러 문장을 넣으면 가독성이 떨어져 코드 간결성에 반한다."},
{n:38,s:"소프트웨어 개발",q:"다음 중 선형 구조로만 묶은 것은?",o:["스택, 트리","큐, 데크","큐, 그래프","리스트, 그래프"],a:1,e:"선형 구조: 스택, 큐, 데크, 리스트 / 비선형 구조: 트리, 그래프"},
{n:39,s:"소프트웨어 개발",q:"코드 인스펙션과 관련한 설명으로 틀린 것은?",o:["프로그램을 실행시키는 것 없이 눈으로 확인하는 방법으로 볼 수 있다.","코드 품질 향상 기법 중 하나이다.","인스펙션 시에만 활용되는 기법이다.","결함과 함께 코드 표준 준수 여부, 효율성 등 다른 품질 이슈를 동시에 검사한다."],a:2,e:"코드 인스펙션은 다양한 개발 단계에서 활용되는 정적 검사 기법이다."},
{n:40,s:"소프트웨어 개발",q:"소프트웨어를 재사용함으로써 얻을 수 있는 이점으로 가장 거리가 먼 것은?",o:["생산성 증가","프로젝트 문서 공유","소프트웨어 품질 향상","새로운 개발 방법론 도입 용이"],a:3,e:"소프트웨어 재사용은 검증된 모듈을 활용하는 것으로, 새로운 개발 방법론 도입과는 직접적 관련이 없다."},
// 제3과목 데이터베이스 구축
{n:41,s:"데이터베이스 구축",q:"후보키를 구성하는 모든 튜플에 대해 유일성과 ( )을 모두 만족시켜야 한다. ( ) 안에 들어갈 내용으로 적절한 것은?",o:["중복성","최소성","참조성","동일성"],a:1,e:"후보키(Candidate Key)의 조건: 유일성(Uniqueness) + 최소성(Minimality)"},
{n:42,s:"데이터베이스 구축",q:"E-R 모델의 표현 방법으로 옳지 않은 것은?",o:["관계 : 마름모","속성 : 타원형","개체 : 삼각형","연결 : 선"],a:2,e:"개체(Entity)는 삼각형이 아닌 직사각형으로 표기한다."},
{n:43,s:"데이터베이스 구축",q:"데이터베이스 '개체 무결성 제약' 조건에 대한 설명으로 맞는 것은?",o:["데이터 내의 특성들이 각 속성이 정의된 소속 도메인에 지정된 값을 가져야 한다.","릴레이션의 기본키를 구성하는 어떤 속성값도 널 값이나 중복값을 가질 수 없다.","릴레이션은 참조할 수 없는 외래키 값을 가질 수 없다.","릴레이션의 기본키를 구성하는 속성값은 중복값을 가질 수 있지만 널 값을 가질 수 없다."],a:1,e:"개체 무결성: 기본키는 NULL과 중복값 모두 불가. ①=도메인 무결성, ③=참조 무결성."},
{n:44,s:"데이터베이스 구축",q:"릴레이션에 대한 설명으로 거리가 먼 것은?",o:["튜플들의 삽입, 삭제 등의 작업으로 인해 릴레이션은 시간에 따라 변한다.","한 릴레이션에 포함된 튜플들은 모두 상이하다.","애트리뷰트는 논리적으로 더 이상 쪼갤 수 없는 원자값으로 구성된다.","한 릴레이션에 포함된 튜플 사이에는 순서가 있어야 한다."],a:3,e:"관계형 데이터베이스에서 튜플 간의 순서는 의미가 없다(순서 없음)."},
{n:45,s:"데이터베이스 구축",q:"아래 SQL문에서 문법적 오류가 있는 부분은?\n\n(1) SELECT player_name, height\n(2) FROM player\n(3) WHERE team_id = 'korea'\n(4) AND height BETWEEN 170 OR 180;",o:["(1)","(2)","(3)","(4)"],a:3,e:"BETWEEN 절의 올바른 문법: BETWEEN 170 AND 180 (OR가 아닌 AND 사용)"},
{n:46,s:"데이터베이스 구축",q:"DCL(Data Control Language) 명령어가 아닌 것은?",o:["COMMIT","ROLLBACK","GRANT","SELECT"],a:3,e:"SELECT는 DML(Data Manipulation Language)이다. DCL: GRANT, REVOKE / TCL: COMMIT, ROLLBACK"},
{n:47,s:"데이터베이스 구축",q:"릴레이션 R의 모든 결정자(Determinant)가 후보키이면 그 릴레이션 R은 어떤 정규형에 속하는가?",o:["제 1 정규형","제 2 정규형","보이스/코드 정규형","제 4 정규형"],a:2,e:"BCNF(Boyce-Codd Normal Form): 모든 결정자가 후보키인 정규형."},
{n:48,s:"데이터베이스 구축",q:"릴레이션 A1의 도메인이 3개, A2의 도메인이 2개, A3의 도메인이 4개일 때 이 릴레이션들이 표현할 수 있는 최대 튜플의 수는?",o:["24","12","8","6"],a:0,e:"최대 튜플 수 = 각 도메인의 값을 곱함: 3 × 2 × 4 = 24"},
{n:49,s:"데이터베이스 구축",q:"관계대수에 대한 설명으로 틀린 것은?",o:["주어진 릴레이션 조작을 위한 언어의 집합이다.","일반 집합 연산과 순수 관계 연산으로 구분된다.","대상 해를 구하는 방법을 명시하는 절차적 정형 언어이다.","원하는 정보와 그 정보를 어떻게 유도하는가를 기술하는 비절차적 방법이다."],a:3,e:"관계대수는 절차적(Procedural) 언어이다. 비절차적 언어는 관계해석(Relational Calculus)이다."},
{n:50,s:"데이터베이스 구축",q:"정규화, 속성, 관계를 시스템의 형성과 개발 운영의 단순화를 위해 중복, 통합, 분리 등을 수행하는 데이터 모델링 기법은?",o:["정규화","반정규화","단편화","이행"],a:1,e:"반정규화(Denormalization): 성능 최적화를 위해 중복, 통합, 분리 등을 수행하는 기법."},
{n:51,s:"데이터베이스 구축",q:"트랜잭션을 수행하는 도중 장애로 인해 손상된 데이터베이스를 손상되기 이전의 정상적인 상태로 복구시키는 작업은?",o:["Recovery","Commit","Abort","Restart"],a:0,e:"Recovery(회복): 장애 발생 시 DB를 이전 정상 상태로 복구하는 작업."},
{n:52,s:"데이터베이스 구축",q:"시스템 카탈로그에 대한 설명으로 틀린 것은?",o:["시스템 카탈로그의 갱신은 무결성 유지를 위해 SQL을 이용한 사용자가 직접 갱신하여야 한다.","데이터베이스에 저장되는 정보는 데이터베이스에 대한 정보를 유지관리한다.","DBMS가 스스로 생성하고 유지하는 데이터베이스 내의 특별한 테이블의 집합이다.","데이터 사전이라고도 한다."],a:0,e:"시스템 카탈로그는 DBMS가 자동으로 생성·관리하며 사용자가 직접 수정할 수 없다."},
{n:53,s:"데이터베이스 구축",q:"속성(attribute)에 대한 설명으로 틀린 것은?",o:["속성은 개체의 특성을 기술한다.","속성의 수를 차수(degree)라고 한다.","속성은 데이터베이스를 구성하는 가장 작은 논리적 단위이다.","속성 수를 카디널리티(Cardinality)라고 한다."],a:3,e:"카디널리티(Cardinality)는 튜플의 수이고, 속성의 수는 차수(Degree)이다."},
{n:54,s:"데이터베이스 구축",q:"정규화 이상 현상(Anomaly)의 종류에 해당하지 않는 것은?",o:["검색 이상","삽입 이상","삭제 이상","갱신 이상"],a:0,e:"이상 현상의 종류: 삽입 이상, 삭제 이상, 갱신(수정) 이상. '검색 이상'은 존재하지 않는다."},
{n:55,s:"데이터베이스 구축",q:"다음 관계 대수 중 순수 관계 연산자가 아닌 것은?",o:["차집합(Difference)","프로젝션","조인(Join)","디비전(Division)"],a:0,e:"차집합(Difference)은 일반 집합 연산자이다. 순수 관계 연산자: Select, Project, Join, Division"},
{n:56,s:"데이터베이스 구축",q:"트랜잭션의 주요 특성 중 하나로, 둘 이상의 트랜잭션이 동시에 병행 실행되는 경우 어느 하나의 트랜잭션도 다른 트랜잭션의 연산에 끼어들 수 없음을 의미하는 것은?",o:["Log","Transparency","Isolation","Durability"],a:2,e:"Isolation(고립성): 트랜잭션 실행 중 다른 트랜잭션의 간섭 불가. ACID 특성 중 하나."},
{n:57,s:"데이터베이스 구축",q:"릴레이션 내의 속성들의 집합으로 구성된 키로서, 릴레이션을 구성하는 모든 튜플에 대해 유일성은 만족시키지만 최소성은 만족시키지 못하는 키는?",o:["후보키","대체키","슈퍼키","외래키"],a:2,e:"슈퍼키(Super Key): 유일성 O, 최소성 X / 후보키(Candidate Key): 유일성 O, 최소성 O"},
{n:58,s:"데이터베이스 구축",q:"물리적 데이터베이스 설계에 대한 설명으로 거리가 먼 것은?",o:["물리적 데이터베이스 설계는 논리적 설계를 유효한 방법으로 변환하는 것이다.","저장 레코드의 형식, 순서, 접근 경로와 같은 정보를 사용하여 설계한다.","트랜잭션 처리량과 응답시간, 디스크 용량 등을 고려해야 한다.","트랜잭션의 순서, 접근 경로와 관계없이 데이터 타입만을 단일 관계로 표현한다."],a:3,e:"물리적 설계는 접근 경로, 저장 구조 등을 포함하여 실제 저장 방식을 결정한다."},
{n:59,s:"데이터베이스 구축",q:"뷰(View)에 대한 설명으로 틀린 것은?",o:["뷰 위에 또 다른 뷰를 정의할 수 있다.","뷰에 대한 검색은 기본 테이블과 거의 동일하게 사용할 수 있다.","사용자가 필요한 정보를 요구에 맞게 가공하여 뷰로 만들 수 있다.","SQL을 사용하여 뷰에 대한 삽입, 갱신, 삭제 연산 시 제약 사항이 없다."],a:3,e:"뷰에 대한 삽입·갱신·삭제에는 여러 제약 사항이 존재한다(예: 집계 함수 포함 뷰는 갱신 불가)."},
{n:60,s:"데이터베이스 구축",q:"데이터 모델의 구성 요소 중 데이터 구조에 따라 개념 세계나 컴퓨터 세계에서 실제로 표현된 값들을 처리하는 작업을 의미하는 것은?",o:["Data Structure","Operation","Relation","Constraint"],a:1,e:"데이터 모델 3요소: 구조(Structure), 연산(Operation), 제약(Constraint). 연산은 데이터 처리 작업을 의미."},
// 제4과목 프로그래밍 언어 활용
{n:61,s:"프로그래밍 언어 활용",q:"IP 주소체계와 관련한 설명으로 틀린 것은?",o:["IPv6의 패킷 헤더는 32 octet의 고정된 길이를 가진다.","IPv6는 주소 자동설정(Auto Configuration) 기능을 통해 손쉽게 이용자의 단말을 네트워크에 접속시킬 수 있다.","IPv4는 호스트 주소를 자동으로 설정하며 유니캐스트(Unicast)를 지원한다.","IPv4는 클래스별로 네트워크와 호스트 주소의 길이가 다르다."],a:0,e:"IPv6의 패킷 헤더는 40 octet(320 bit)의 고정된 길이를 가진다."},
{n:62,s:"프로그래밍 언어 활용",q:"효과적인 모듈 설계를 위한 유의사항으로 거리가 먼 것은?",o:["모듈 간의 결합도를 강하게 하면 모듈 독립성이 향상된다.","복잡도와 중복성을 줄이고 일관성을 유지시킨다.","모듈의 기능은 예측이 가능해야 한다.","유지보수가 용이해야 한다."],a:0,e:"모듈 독립성을 높이려면 결합도를 약하게(낮게), 응집도를 강하게(높게) 해야 한다."},
{n:63,s:"프로그래밍 언어 활용",q:"다음 C 언어 프로그램이 실행되었을 때, 실행 결과는?\n\nstruct st { int a; int c[10]; };\nob1.a=0; ob2.a=0;\nfor(i=0;i<10;i++) { ob1.c[i]=i; ob2.c[i]=ob1.c[i]+i; }\nfor(i=0;i<10;i=i+2) { ob1.a+=ob1.c[i]; ob2.a+=ob2.c[i]; }\nprintf(\"%d\", ob1.a+ob2.a);",o:["30","60","80","120"],a:1,e:"i=0,2,4,6,8일 때: ob1.a = 0+2+4+6+8=20, ob2.c[i]=2i이므로 ob2.a=0+4+8+12+16=40. 합계=60"},
{n:64,s:"프로그래밍 언어 활용",q:"다음 중 C 언어에서 우선순위가 가장 높은 것은?",o:["비트 연산자","시프트 연산자","관계 연산자","산술 연산자"],a:3,e:"C 연산자 우선순위(높은 순): 단항 > 산술(*/%) > 산술(+-) > 시프트 > 관계 > 비트 > 논리"},
{n:65,s:"프로그래밍 언어 활용",q:"다음 파이썬 코드에서 '53t44'를 입력했을 때 출력 결과는?\n\na, b = map(int, input().split(\"t\"))\nprint(a, b)",o:["53 t 44","53t44","53 44","53, 44"],a:2,e:"'53t44'.split('t') → ['53','44'], map(int,...) → a=53, b=44, print(a, b) → '53 44'"},
{n:66,s:"프로그래밍 언어 활용",q:"흐름 제어(Flow Control)에 대한 설명으로 옳지 않은 것은?",o:["정지-대기는 수신 측의 확인 신호(ACK)를 받은 후에 다음 패킷을 전송하는 방식이다.","확인 신호를 이용하여 송신 데이터의 양을 조절하는 방식은 슬라이딩 윈도우이다.","확인 신호 없이 보낼 수 있는 패킷의 최대치가 윈도우 크기이다.","이전에 송신한 패킷에 대한 부정 수신 응답(NAK)이 전달된 경우 윈도우 크기가 증가한다."],a:3,e:"NAK을 받으면 윈도우 크기가 감소하고 해당 패킷을 재전송한다."},
{n:67,s:"프로그래밍 언어 활용",q:"다음 C 언어 프로그램이 실행되었을 때의 결과는?\n\nint n = 4;\nint* pt = NULL;\npt = &n;\nprintf(\"%d\", &n + *pt - *&pt + n);",o:["0","4","8","12"],a:2,e:"*pt=4, *&pt=pt=&n이므로: &n + 4 - &n + 4 = 8"},
{n:68,s:"프로그래밍 언어 활용",q:"커널의 버전을 확인할 때 사용하는 리눅스 명령어는?",o:["chmod","ls","rm","uname"],a:3,e:"uname: 시스템 정보(커널 버전 등)를 출력하는 리눅스 명령어. 'uname -r'로 커널 버전 확인."},
{n:69,s:"프로그래밍 언어 활용",q:"지역성(Locality)의 종류 중 시간 구역성(Temporal Locality)과 거리가 먼 것은?",o:["루프","서브루틴","배열 순회","스택"],a:2,e:"시간 구역성: 최근 사용된 데이터가 가까운 미래에 다시 사용될 가능성(루프, 서브루틴, 스택). 배열 순회는 공간 구역성(Spatial Locality)에 해당한다."},
{n:70,s:"프로그래밍 언어 활용",q:"C 언어에서 변수로 사용할 수 없는 것은?",o:["data02","int01","_sub","short"],a:3,e:"short는 C 언어의 예약어(키워드)이므로 변수명으로 사용할 수 없다. data02, int01, _sub는 유효한 식별자이다."},
{n:71,s:"프로그래밍 언어 활용",q:"다음 중 가장 약한 결합도(Coupling)는?",o:["Common Coupling","Content Coupling","External Coupling","Stamp Coupling"],a:3,e:"결합도 강도(강→약): Content > Common > External > Control > Stamp > Data. 보기 중 Stamp가 가장 약하다."},
{n:72,s:"프로그래밍 언어 활용",q:"다음과 같은 형태로 임계 구역의 접근을 제어하는 상호배제 기법은?\n\nP(S): while S<=0 do skip; S:=S-1;\nV(S): S:=S+1;",o:["Dekker Algorithm","Lamport Algorithm","Peterson Algorithm","Semaphore"],a:3,e:"P(S)/V(S) 연산은 세마포어(Semaphore)의 대기(wait)와 신호(signal) 연산이다."},
{n:73,s:"프로그래밍 언어 활용",q:"다음 파이썬 코드에서 '53t44'를 입력했을 때 출력 결과는?\n\na, b = map(int, input().split(\"t\"))\nprint(a, b)",o:["53 t 44","53t44","53 44","53, 44"],a:2,e:"'53t44'.split('t') → ['53','44'] → a=53, b=44 → print(a, b) → '53 44'"},
{n:74,s:"프로그래밍 언어 활용",q:"네트워크 장비에 대한 설명으로 옳지 않은 것은?",o:["브라우저는 전송되는 신호의 장거리 전송을 위해 신호를 재생하여 다시 송신하는 기능을 수행한다.","브리지는 LAN을 연결하거나 LAN 안에서의 컴퓨터 그룹을 연결하는 기능을 수행하며 MAC 기반 경로를 사용한다.","스위치는 LAN과 LAN의 연결이 돼서 큰 LAN을 만드는 장치로, OSI 2계층에서 동작한다.","라우터는 LAN과 LAN의 연결 기능이 다른 LAN이나 WAN의 연결도 수행하고, OSI 3계층에서 동작한다."],a:0,e:"신호를 재생하여 재전송하는 장비는 브라우저(Browser)가 아닌 리피터(Repeater)이다."},
{n:75,s:"프로그래밍 언어 활용",q:"HTTP의 잘 알려진(Well Known) 포트 번호는?",o:["23","80","53","443"],a:1,e:"HTTP: 80 / HTTPS: 443 / Telnet: 23 / DNS: 53"},
{n:76,s:"프로그래밍 언어 활용",q:"내부 프로그램의 필수 요소에 대한 설명으로 틀린 것은?",o:["자동화는 심각한 오류 상황 외에는 사용자의 개입 없이 동작해야 한다.","안정성은 어떤 문제가 생겼을 때 언제 발생했는지 등을 추적할 수 있어야 한다.","로그는 대상 애플리케이션의 처리 내용이나 예외 상황 등을 파악할 수 있도록 기록되어야 한다.","성능은 주어진 시간 내에 처리를 완료할 수 없어도 되고, 동작하고 있는 다른 애플리케이션을 방해하지 않아야 한다."],a:3,e:"성능은 반드시 주어진 시간 내에 처리를 완료할 수 있어야 하며, 다른 애플리케이션에 영향을 주어서는 안 된다."},
// 제5과목 정보시스템 구축 관리
{n:77,s:"정보시스템 구축 관리",q:"빈 기억공간의 크기가 20K, 16K, 8K, 40K일 때 'Worst Fit'을 사용하여 17K의 프로그램을 적재할 경우 내부 단편화의 크기는?",o:["3K","23K","44K","67K"],a:1,e:"Worst Fit: 가장 큰 공간(40K)에 배치. 40K - 17K = 23K 남음(내부 단편화)."},
{n:78,s:"정보시스템 구축 관리",q:"IPv4와 IPv6의 주소 전환에 사용되는 기술이 아닌 것은?",o:["듀얼 스택","터널링","헤더 변환","라우팅"],a:3,e:"라우팅은 IPv4/IPv6 전환 기술이 아닌 일반 네트워크 경로 설정 기술이다. 전환 기술: 듀얼 스택, 터널링, 헤더 변환."},
{n:79,s:"정보시스템 구축 관리",q:"JAVA에서 변수와 자료형에 대한 설명으로 틀린 것은?",o:["변수는 어떤 값을 저장하기 위한 메모리 공간으로 사용하는 공간이다.","char 자료형은 한 개의 문자를 저장하고자 할 때 사용한다.","실수 자료형에는 float, short, byte 등이 있다.","boolean 자료형은 조건이 참인지 거짓인지 판별할 때 사용한다."],a:2,e:"short, byte는 정수형 자료형이다. 실수 자료형: float, double."},
{n:80,s:"정보시스템 구축 관리",q:"다음 HRN 스케줄링에 대한 설명으로 옳지 않은 것은?",o:["대기 시간과 서비스 시간을 고려한다.","대기 시간이 긴 프로세스일 경우 우선순위가 높다.","대기 시간이 길어질수록 우선순위가 낮아진다.","SJF 기법을 보완하기 위한 스케줄링 방법이다."],a:2,e:"HRN(Highest Response Ratio Next)은 대기 시간이 길수록 우선순위가 높아져 기아 현상을 방지한다."},
{n:81,s:"정보시스템 구축 관리",q:"다음이 설명하는 기술로 가장 적절한 것은?\n\n- 통신의 중복에 의해 어디서도 항상 직접 접속되는 그물 모양의 네트워크이다.\n- 해당 지역의 무선 네트워크의 경우 최대한 안전하게 전달할 수 있으며 행사장이나 군 등에서 많이 활용된다.",o:["Virtual Local Area Network","Simple Station Network","Mesh Network","Modem Network"],a:2,e:"Mesh Network: 그물 모양으로 모든 노드가 서로 연결된 네트워크 형태."},
{n:82,s:"정보시스템 구축 관리",q:"DoS(Denial of Service) 공격에 대한 설명으로 틀린 것은?",o:["DoS 공격은 정상 크기보다 큰 ICMP 패킷을 작은 조각으로 쪼개어 공격 대상이 받게 하는 방법이다.","Smurf 공격은 멀티캐스트(Multicast)를 활용하여 공격 대상이 증폭된 응답 패킷을 받게 하는 방법이다.","SYN Flooding은 존재하지 않는 클라이언트가 서버별로 한정된 접속 가능 공간에 접속한 것처럼 속이는 방법이다.","Land 공격은 패킷 전송 시 발신인 IP와 목적지 IP를 모두 공격 대상의 IP로 설정하여 전송하는 방법이다."],a:1,e:"Smurf 공격은 멀티캐스트가 아닌 브로드캐스트를 이용한다."},
{n:83,s:"정보시스템 구축 관리",q:"비대칭 암호화 방식으로 소수를 활용한 암호화 알고리즘은?",o:["DES","AES","SMT","RSA"],a:3,e:"RSA: 두 소수의 곱을 이용하는 비대칭 공개키 암호화 알고리즘. DES, AES는 대칭키 알고리즘."},
{n:84,s:"정보시스템 구축 관리",q:"고속 전송과 장거리 연결 및 여러 서버들의 스토리지를 각기 다른 운영체제를 가진 여러 기종이 네트워크상에서 데이터를 공유할 수 있도록 하며, 여러 개의 저장장치나 백업 장비를 단일화시킨 시스템은?",o:["SAN","MBR","NAC","NIC"],a:0,e:"SAN(Storage Area Network): 여러 서버와 스토리지를 고속 네트워크로 연결한 스토리지 전용 네트워크."},
{n:85,s:"정보시스템 구축 관리",q:"정보 보안의 침입통제 정책 중에 해당하지 않는 것은?",o:["물리적 접근 통제","데이터 전달 접근 통제","논리적 접근 통제","역할 기반 접근 통제"],a:1,e:"침입통제 정책: 물리적 접근 통제, 논리적 접근 통제, 역할 기반 접근 통제 등. '데이터 전달 접근 통제'는 일반적인 침입통제 분류에 해당하지 않는다."},
{n:86,s:"정보시스템 구축 관리",q:"다음이 설명하는 것은?\n\n- 사물통신, IoT 등 대역폭이 제한된 통신에 최적화된 푸시기술 기반의 경량 메시지 전송 프로토콜\n- 메시지 브로커(Broker)를 통해 송신자가 특정 메시지를 발행하고 수신자가 구독하는 방식\n- IBM이 주도하여 개발",o:["GRID","TELNET","GPN","MQTT"],a:3,e:"MQTT(Message Queuing Telemetry Transport): IoT 환경에서 경량 메시지를 전송하는 발행-구독 기반 프로토콜."},
{n:87,s:"정보시스템 구축 관리",q:"다음이 설명하는 용어로 옳은 것은?\n\n- 오픈 소스를 기반으로 한 분산 컴퓨팅 플랫폼이다.\n- 일반 PC급 컴퓨터들로 가상화하여 대형 스토리지를 형성한다.\n- 다양한 소스를 통해 생성된 빅데이터를 효율적으로 저장하고 처리한다.",o:["하둡(Hadoop)","비콘(Beacon)","포스퀘어(Foursquare)","멤리스터(Memristor)"],a:0,e:"Hadoop: 오픈 소스 기반 분산 컴퓨팅 플랫폼으로 빅데이터 저장·처리에 사용된다."},
{n:88,s:"정보시스템 구축 관리",q:"COCOMO 모델에 의한 비용 산정에 대한 설명으로 옳지 않은 것은?",o:["프로젝트 유형에 따라 세분화된 비용 유형 모델이다.","프로젝트의 규모와 유형에 따라 비용이 다르게 산정된다.","비용 산정 유형으로 Organic Mode, Embedded Mode, Semi-Detached Mode가 있다.","UFP(Unadjusted Function Point)를 계산한다."],a:3,e:"COCOMO는 LOC(코드 라인 수) 기반 비용 산정 모델이다. UFP는 기능점수(FP) 방법에서 사용한다."},
{n:89,s:"정보시스템 구축 관리",q:"세션 하이재킹을 탐지하는 방법으로 거리가 먼 것은?",o:["FTP SYN SEGMENT 탐지","비동기화 상태 탐지","ACK STORM 탐지","패킷의 유실 및 재전송 증가 탐지"],a:0,e:"세션 하이재킹 탐지: 비동기화 상태 탐지, ACK Storm 탐지, 패킷 유실·재전송 증가 탐지 등. FTP SYN SEGMENT 탐지는 해당 없음."},
{n:90,s:"정보시스템 구축 관리",q:"다음 중 프로토타입 모형을 선택하는 것이 가장 적합한 경우는?",o:["구축하고자 하는 시스템의 요구사항이 불분명할 때","시간의 제약으로 시스템만을 빠르게 보기 위한 경우","고객이 개발 과정에 참여하지 않을 때","시스템 전반에 걸쳐 발생할 수 있는 위험을 최소화하고자 할 때"],a:0,e:"프로토타입 모형: 요구사항이 불명확할 때 시제품을 만들어 요구사항을 명확히 하는 모형."},
{n:91,s:"정보시스템 구축 관리",q:"인증의 유형 중에서 패스워드를 사용하는 경우에 해당하는 인증 유형은?",o:["Something You Have","Something You Are","Something You Know","Somewhere You Are"],a:2,e:"패스워드, PIN 등 지식 기반 인증 = Something You Know. 카드 등 소유 기반 = Have. 지문 등 생체 기반 = Are."},
{n:92,s:"정보시스템 구축 관리",q:"취약점 관리를 위한 응용 프로그램의 보안 설정과 가장 거리가 먼 것은?",o:["서버 파라미터 출입 통제","실행 프로세스 권한 설정","운영체제의 접근 제한","운영체제의 정보 수집 제한"],a:0,e:"서버 파라미터 출입 통제는 응용 프로그램 보안 설정 범주에 해당하지 않는다."},
{n:93,s:"정보시스템 구축 관리",q:"다음에 제시된 프로토콜과 포트의 연결이 잘못된 것은?",o:["UDP 53 포트 - SNMP","TCP 23 포트 - Telnet","UDP 69 포트 - TFTP","UDP 111 포트 - RFC"],a:0,e:"포트 53 = DNS. SNMP = 포트 161(UDP). ② Telnet:23 ③ TFTP:69 는 정확하다."},
{n:94,s:"정보시스템 구축 관리",q:"프로젝트에 내재된 위험 요소를 인식하고 그 영향을 분석하여 이를 관리하는 활동으로서, 위험 요소를 사전에 예측, 대비하는 모든 기술과 활동을 포함하는 것은?",o:["Critical Path Method","Risk Analysis","Work Breakdown Structure","Waterfall Model"],a:1,e:"Risk Analysis(위험 분석): 프로젝트의 잠재적 위험을 식별하고 관리하는 활동."},
{n:95,s:"정보시스템 구축 관리",q:"입력 데이터 검증 및 표현과 관련된 설명으로 옳지 않은 것은?",o:["SQL 삽입: 웹 응용 프로그램에 SQL을 삽입하여 내부 DB 서버의 데이터를 유출 및 변조하고, 관리자 인증을 우회한다.","크로스사이트 스크립트: 웹페이지에 악의적인 스크립트를 삽입하여 방문자들의 정보를 탈취한다.","자원 삽입: 악의적인 명령이 포함된 스크립트 파일을 업로드함으로써 시스템에 손상을 준다.","운영체제 명령어 삽입: 외부 입력값을 통해 시스템 명령어의 실행을 유도함으로써 권한을 탈취하거나 시스템 장애를 유발한다."],a:2,e:"③은 파일 업로드 취약점(Unrestricted File Upload)에 대한 설명이다. 자원 삽입은 사용 가능한 자원(파일, 포트 등)을 악의적으로 지정하는 공격이다."},
{n:96,s:"정보시스템 구축 관리",q:"어떤 외부 컴퓨터가 접속되면 접속 인가 여부를 점검해서 인가된 경우에는 허용되고, 그 반대의 경우에는 거부할 수 있는 접근제어 유틸리티는?",o:["tcp wrapper","trace checker","token finder","change detector"],a:0,e:"tcp_wrapper: 네트워크 서비스에 대한 접근을 호스트 기반으로 제어하는 유틸리티."},
{n:97,s:"정보시스템 구축 관리",q:"위조된 MAC 주소를 지속적으로 네트워크로 흘려보내 스위치 MAC 주소 테이블의 저장 기능을 혼란시켜 더미 허브처럼 작동하게 하는 공격은?",o:["Parsing","LAN Tapping","Switch Jamming","FTP Flooding"],a:2,e:"Switch Jamming: MAC 주소 테이블을 가득 채워 스위치를 허브처럼 동작시키는 공격."},
{n:98,s:"정보시스템 구축 관리",q:"국내 IT 서비스 경쟁력 강화를 목표로 개발되었으며 인프라 제어 및 관리 환경, 실행 환경, 개발 환경, 서비스 환경, 운영 환경으로 구성되어 있는 개방형 클라우드 컴퓨팅 플랫폼은?",o:["N2OS","PaaS-TA","KAWS","Metaverse"],a:1,e:"PaaS-TA: 국내에서 개발한 개방형 클라우드 컴퓨팅 플랫폼."},
{n:99,s:"정보시스템 구축 관리",q:"Secure OS의 보안 기능으로 거리가 먼 것은?",o:["식별 및 인증","임의적 접근 통제","고가용성 지원","강제적 접근 통제"],a:2,e:"고가용성(High Availability) 지원은 보안 기능이 아닌 가용성(Availability) 기능이다. Secure OS 보안 기능: 식별 및 인증, 임의적 접근 통제, 강제적 접근 통제, 객체 재사용 보호 등."},
{n:100,s:"정보시스템 구축 관리",q:"다음 암호 알고리즘 중 성격이 다른 하나는?",o:["MD4","MD5","SHA-1","AES"],a:3,e:"MD4, MD5, SHA-1은 해시 함수(단방향 암호화), AES는 대칭키 블록 암호화 알고리즘이다."}
];

const PS=5;
let cp=0,ua={};
const ls=()=>{try{const d=localStorage.getItem('q3h');if(d)ua=JSON.parse(d);cp=parseInt(localStorage.getItem('q3hp')||'0');}catch(e){}};
const ss=()=>{try{localStorage.setItem('q3h',JSON.stringify(ua));localStorage.setItem('q3hp',String(cp));}catch(e){}};
const tp=()=>Math.ceil(Q.length/PS);
const gq=()=>Q.slice(cp*PS,(cp+1)*PS);

function upd(){
  let t=Object.keys(ua).length,c=0,w=0;
  Object.entries(ua).forEach(([k,v])=>{const q=Q.find(x=>String(x.n)===k);if(q){v===q.a?c++:w++;}});
  document.getElementById('st').textContent=t;
  document.getElementById('sc').textContent=c;
  document.getElementById('sw').textContent=w;
  document.getElementById('sr').textContent=Q.length-t;
  document.getElementById('pbar').style.width=(t/Q.length*100)+'%';
}

function render(){
  upd();
  const qs=gq(),nm=['①','②','③','④'];
  let h='';
  qs.forEach(q=>{
    const ans=ua[String(q.n)];
    const done=ans!==undefined;
    let qt=q.q.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const parts=qt.split('\n\n');
    h+=`<div class="qcard">`;
    h+=`<div class="qmeta"><span class="badge n">Q${q.n}</span><span class="badge">${q.s}</span></div>`;
    h+=`<div class="qtext">${parts[0]}</div>`;
    if(parts.length>1) h+=`<div class="code">${parts.slice(1).join('\n\n')}</div>`;
    h+=`<div class="opts">`;
    q.o.forEach((o,i)=>{
      let cl='opt';
      if(done){cl+=(i===q.a?' ok':(i===ans?' ng':' hi'));}
      h+=`<button class="${cl}" ${done?'disabled':''} onclick="sel(${q.n},${i})">${nm[i]} ${o.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</button>`;
    });
    h+='</div>';
    if(done&&q.e) h+=`<div class="explain">💡 ${q.e}</div>`;
    h+='</div>';
  });
  document.getElementById('qa').innerHTML=h;
  const t2=tp();
  document.getElementById('pi').textContent=`${cp+1} / ${t2} 페이지`;
  document.getElementById('bp').disabled=cp===0;
  const last=cp===t2-1;
  const bn=document.getElementById('bn');
  bn.textContent=last?'결과 보기 🏁':'다음 ▶';
  bn.onclick=last?showResult:()=>gp(1);
}

function sel(n,i){
  if(ua[String(n)]!==undefined)return;
  ua[String(n)]=i;ss();render();
}

function gp(d){
  const np=cp+d;
  if(np<0||np>=tp())return;
  cp=np;ss();render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function showResult(){
  document.getElementById('qa').style.display='none';
  document.querySelector('.nav').style.display='none';
  document.getElementById('rarea').style.display='block';
  let c=0;const wl=[];
  Q.forEach(q=>{const a=ua[String(q.n)];if(a===q.a)c++;else if(a!==undefined)wl.push(q);});
  const pct=Math.round(c/Q.length*100);
  document.getElementById('rsc').textContent=`${c} / ${Q.length}`;
  document.getElementById('rsb').textContent=`정답률 ${pct}%`;
  const rv=document.getElementById('rv');
  if(pct>=60){rv.textContent='🎉 합격권입니다! (60점 이상)';rv.className='verdict vp';}
  else{rv.textContent='📚 60점 미만 — 조금 더 공부가 필요해요!';rv.className='verdict vf';}
  if(wl.length>0){
    document.getElementById('wb').style.display='block';
    const nm=['①','②','③','④'];
    let wh='';
    wl.forEach(q=>{
      const my=ua[String(q.n)];
      wh+=`<div class="witem">`;
      wh+=`<div class="qmeta" style="margin-bottom:5px"><span class="badge n">Q${q.n}</span><span class="badge">${q.s}</span></div>`;
      wh+=`<div class="wq">${q.q.split('\n\n')[0].replace(/&/g,'&amp;').replace(/</g,'&lt;').substring(0,100)}...</div>`;
      wh+=`<div class="wa">내 답: <strong>${nm[my]} ${q.o[my].substring(0,30)}...</strong> → 정답: <strong style="color:#2a7d32">${nm[q.a]} ${q.o[q.a].substring(0,30)}...</strong></div>`;
      if(q.e) wh+=`<div class="wex">💡 ${q.e}</div>`;
      wh+='</div>';
    });
    document.getElementById('wl').innerHTML=wh;
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

function reset(){
  ua={};cp=0;ss();
  document.getElementById('qa').style.display='';
  document.querySelector('.nav').style.display='';
  document.getElementById('rarea').style.display='none';
  render();
}

ls();render();
window.addEventListener('beforeunload',ss);
</script>
</body>
</html>
