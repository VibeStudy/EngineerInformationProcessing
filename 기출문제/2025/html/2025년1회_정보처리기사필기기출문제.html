<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:#f4f4f0;color:#1a1a1a;min-height:100vh;padding:1.5rem 1rem}
.wrap{max-width:740px;margin:0 auto}
h1{font-size:1.35rem;font-weight:700;margin-bottom:0.25rem}
.subtitle{font-size:0.82rem;color:#888;margin-bottom:1.2rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1rem}
.stat{background:#fff;border-radius:10px;padding:0.65rem 0.4rem;text-align:center;border:1px solid #e8e8e8}
.stat-num{font-size:1.35rem;font-weight:700;color:#1a1a1a}
.stat.co .stat-num{color:#2a7d32}
.stat.wr .stat-num{color:#c62828}
.stat.re .stat-num{color:#1455b5}
.stat-label{font-size:0.68rem;color:#999;margin-top:1px}
.prog-bg{height:6px;background:#e0e0e0;border-radius:3px;margin-bottom:1.4rem}
.prog-fill{height:6px;background:#1455b5;border-radius:3px;transition:width .35s}
.qcard{background:#fff;border-radius:13px;padding:1.2rem 1.3rem;margin-bottom:1rem;border:1px solid #e8e8e8}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:0.55rem}
.badge{font-size:0.68rem;padding:2px 8px;border-radius:20px;background:#f2f2f2;color:#666;border:1px solid #e0e0e0}
.badge.n{background:#e3ebfd;color:#1455b5;border-color:#b8cefc}
.qtext{font-size:0.92rem;line-height:1.72;margin-bottom:0.9rem;white-space:pre-wrap}
.code{background:#1e1e2e;color:#cdd6f4;font-family:monospace;font-size:0.78rem;padding:0.85rem;border-radius:8px;margin:0.4rem 0 0.9rem;overflow-x:auto;white-space:pre;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{width:100%;text-align:left;padding:0.65rem 0.95rem;border-radius:8px;border:1.5px solid #ddd;background:#fff;cursor:pointer;font-size:0.86rem;color:#1a1a1a;line-height:1.5;transition:all .12s;font-family:inherit}
.opt:hover:not(:disabled){background:#f0f5ff;border-color:#8fb5fd}
.opt.ok{background:#e8f5e9;border-color:#43a047;color:#1b5e20;font-weight:600}
.opt.ng{background:#ffebee;border-color:#e53935;color:#b71c1c}
.opt.hi{background:#fff8e1;border-color:#ffa000}
.opt:disabled{cursor:default}
.explain{margin-top:0.75rem;padding:0.65rem 0.9rem;background:#f0f7ff;border-left:3px solid #1455b5;border-radius:0 8px 8px 0;font-size:0.8rem;color:#333;line-height:1.65}
.nav{display:flex;justify-content:space-between;align-items:center;margin:1.1rem 0}
.nbtn{padding:0.5rem 1.3rem;border-radius:8px;border:1.5px solid #ccc;background:#fff;cursor:pointer;font-size:0.86rem;color:#333;font-family:inherit;transition:all .12s}
.nbtn:hover:not(:disabled){background:#f0f0f0}
.nbtn:disabled{opacity:.35;cursor:default}
.nbtn.pr{background:#1455b5;border-color:#1455b5;color:#fff;font-weight:600}
.nbtn.pr:hover:not(:disabled){background:#0d47a1}
.pinfo{font-size:0.8rem;color:#aaa}
#rarea{display:none}
.rbox{background:#fff;border-radius:13px;padding:1.4rem;margin-bottom:1rem;border:1px solid #e8e8e8}
.rscore{text-align:center;padding:1rem 0}
.rnum{font-size:2.8rem;font-weight:800;color:#1455b5}
.rsub{font-size:0.88rem;color:#888;margin-top:4px}
.verdict{text-align:center;padding:0.6rem 1rem;border-radius:8px;font-size:0.86rem;margin-top:0.8rem;font-weight:500}
.vp{background:#e8f5e9;color:#2a7d32;border:1px solid #a5d6a7}
.vf{background:#ffebee;color:#c62828;border:1px solid #ef9a9a}
.wtitle{font-size:0.95rem;font-weight:700;margin-bottom:0.9rem;padding-bottom:0.5rem;border-bottom:2px solid #ffcdd2}
.witem{border-left:3px solid #e53935;padding:0.75rem 0.9rem;margin-bottom:0.75rem;background:#fff9f9;border-radius:0 8px 8px 0}
.wq{font-size:0.82rem;color:#1a1a1a;margin-bottom:0.35rem;line-height:1.5}
.wa{font-size:0.76rem;color:#666;margin-top:3px}
.wex{font-size:0.73rem;color:#777;margin-top:5px;line-height:1.5}
.rbtn{display:block;width:100%;padding:0.75rem;border-radius:10px;background:#1455b5;color:#fff;border:none;font-size:0.92rem;font-weight:600;cursor:pointer;margin-top:0.8rem;font-family:inherit}
.rbtn:hover{background:#0d47a1}
.progress-section{margin-bottom:1.5rem;background:#fff;border-radius:12px;padding:1rem 1.2rem;border:1px solid #e8e8e8}
.progress-title{font-size:0.8rem;color:#888;margin-bottom:0.5rem}
.subject-bars{display:flex;flex-direction:column;gap:6px}
.sbar-row{display:flex;align-items:center;gap:8px}
.sbar-label{font-size:0.72rem;color:#666;min-width:80px}
.sbar-bg{flex:1;height:6px;background:#e8e8e8;border-radius:3px}
.sbar-fill{height:6px;border-radius:3px;transition:width .3s}
.sbar-count{font-size:0.7rem;color:#aaa;min-width:30px;text-align:right}
</style>
</head>

<div class="wrap">

  </div>

<script>
const Q=[
// 제1과목 소프트웨어 설계
{n:1,s:"소프트웨어 설계",q:"소프트웨어 공학에서 워크스루(Walkthrough)에 대한 설명으로 틀린 것은?",o:["사용사례를 확장하여 명세하거나 설계 다이어그램, 원시코드, 테스트 케이스 등에 적용할 수 있다.","복잡한 알고리즘 또는 반복, 실시간 동작, 병행 처리와 같은 기능이나 동작을 이해하려고 할 때 유용하다.","인스펙션(Inspection)과 동일한 의미를 가진다.","단순한 테스트 케이스를 이용하여 프로덕트를 수작업으로 수행해 보는 것이다."],a:2,e:"워크스루는 개발자 주도의 비형식적 검토이고, 인스펙션은 훈련된 검토자들이 수행하는 공식적 검토로 서로 다르다."},
{n:2,s:"소프트웨어 설계",q:"애자일 방법론에 해당하지 않는 것은?",o:["기능 중심 개발","개발 및 검증","칸반","익스트림 프로그래밍"],a:1,e:"'개발 및 검증(V-Model)'은 폭포수 기반 방법론이다. 애자일: 기능 중심 개발(FDD), 칸반, XP, 스크럼 등."},
{n:3,s:"소프트웨어 설계",q:"익스트림 프로그래밍에 대한 설명으로 틀린 것은?",o:["대표적인 구조적 방법론 중 하나이다.","소규모 개발 조직이 불확실하고 변경이 많은 요구를 접하였을 때 적절한 방법이다.","익스트림 프로그래밍을 구동시키는 원리는 상식적인 원리와 경험을 최대한 끌어 올리는 것이다.","구체적인 실천 방법을 정의하고 있으며, 개발 문서보다는 소스코드에 중점을 둔다."],a:0,e:"XP는 애자일 방법론의 하나이다. 구조적 방법론이 아니다."},
{n:4,s:"소프트웨어 설계",q:"럼바우(Rumbaugh) 분석 기법에서 정보 모델링이라고도 하며, 시스템에서 요구되는 객체를 찾아내어 속성과 연산 식별 및 객체들 간의 관계를 규정하여 다이어그램을 표시하는 모델링은?",o:["Object","Dynamic","Function","Static"],a:0,e:"럼바우 분석 기법: Object(정보 모델링) → Dynamic(상태 다이어그램) → Function(DFD)"},
{n:5,s:"소프트웨어 설계",q:"설계 기법 중 하향식 설계 방법과 상향식 설계 방법에 대한 비교 설명으로 가장 옳지 않은 것은?",o:["하향식 설계에서는 통합 검사 시 인터페이스가 이미 정의되어 있어 통합이 간단하다.","하향식 설계에서 레벨이 낮은 데이터 구조의 세부 사항은 설계 초기 단계에서 필요하다.","상향식 설계는 최하위 수준에서 각각의 모듈들을 설계하고 이러한 모듈이 완성되면 이들을 결합하여 검사한다.","상향식 설계에서는 인터페이스가 이미 성립되어 있지 않더라도 기능 추가가 쉽다."],a:3,e:"상향식 설계에서는 인터페이스가 이미 성립되어 있지 않으면 기능 추가가 어렵다."},
{n:6,s:"소프트웨어 설계",q:"요구사항 명세에 대한 설명으로 틀린 것은?",o:["분석된 요구사항을 바탕으로 모델을 작성하고 문서화하는 것이다.","기능 요구사항은 빠짐없이 완전하고 명확하게 기술해야 한다.","잘못된 부분이 확인될 경우 그 내용을 요구사항 정의서에서 추적할 수 있어야 한다.","구체적인 명세를 위해 자료 사전(DD)가 사용될 수 있다."],a:3,e:"자료 사전(DD)은 DFD를 보완하는 도구이지 요구사항 명세의 주된 도구가 아니다."},
{n:7,s:"소프트웨어 설계",q:"바람직한 소프트웨어 설계 지침이 아닌 것은?",o:["결합도를 최소화하고 응집도를 최대화한다.","복잡도와 중복성을 줄이고 일관성을 유지시킨다.","하나의 입구와 하나의 출구를 갖도록 해야 한다.","모듈의 크기를 가능한 작게 구성하여 병행성 수준을 높여야 한다."],a:3,e:"모듈 크기를 무작정 작게 하면 모듈 간 인터페이스가 복잡해진다. 병행성 수준 향상이 목적이 아니다."},
{n:8,s:"소프트웨어 설계",q:"UML에 대한 설명 중 틀린 것은?",o:["기능적 모델은 사용자 측면에서 본 시스템 기능이며, UML에서는 Use Case Diagram을 사용한다.","정적 모델은 객체, 속성, 연관관계, 오퍼레이션의 시스템의 구조를 나타내며, UML에서는 Class Diagram을 사용한다.","동적 모델은 시스템의 내부 동작을 말하며, UML에서는 Sequence Diagram, State Diagram, Activity Diagram을 사용한다.","State Diagram은 객체들 사이의 메시지 교환을 나타내며, Sequence Diagram은 하나의 객체가 가진 상태와 그 상태의 변화에 의한 동작 순서를 나타낸다."],a:3,e:"State Diagram은 객체의 상태 변화, Sequence Diagram은 객체 간 메시지 교환. ④는 서로 뒤바뀌었다."},
{n:9,s:"소프트웨어 설계",q:"코드 설계에서 일정한 일련번호를 부여하는 방식의 코드는?",o:["연상 코드","블록 코드","순차 코드","표의 숫자 코드"],a:2,e:"순차 코드: 자료의 발생 순서, 크기 순서 등 일정한 일련번호를 부여하는 방식."},
{n:10,s:"소프트웨어 설계",q:"시스템의 구성 요소로 볼 수 없는 것은?",o:["Process","Feedback","Maintenance","Control"],a:2,e:"시스템 구성 요소: 입력(Input), 처리(Process), 출력(Output), 제어(Control), 피드백(Feedback). Maintenance(유지보수)는 구성 요소가 아니다."},
{n:11,s:"소프트웨어 설계",q:"파이프 필터 형태의 소프트웨어 아키텍처에 대한 설명으로 옳은 것은?",o:["노드와 간선으로 구성된다.","서브시스템이 입력 데이터를 받아 처리하고 결과를 다음 서브시스템으로 넘겨주는 과정을 반복한다.","계층 모델이라고도 한다.","3개의 서브시스템(모델, 뷰, 제어)으로 구성되어 있다."],a:1,e:"①은 그래프, ③은 레이어 아키텍처, ④는 MVC 패턴에 대한 설명이다."},
{n:12,s:"소프트웨어 설계",q:"데이터 흐름도(DFD)의 구성 요소에 포함되지 않는 것은?",o:["Data Flow","Data Dictionary","Process","Data Store"],a:1,e:"DFD 구성 요소: 프로세스(Process), 데이터 흐름(Data Flow), 데이터 저장소(Data Store), 외부 개체(External Entity). Data Dictionary는 보완 도구이다."},
{n:13,s:"소프트웨어 설계",q:"사용자 인터페이스의 설계 지침에 대한 설명으로 옳지 않은 것은?",o:["조작 방법을 가능한 다양화하여 많은 기능이 들어갈 수 있도록 구성해야 한다.","버튼이나 조작 방법 등을 일관성 있게 제공해야 한다.","작동시킬 기능만 보고도 결과를 미리 예측할 수 있게 설계해야 한다.","사용자가 쉽게 이해하고 편리하게 사용할 수 있는 환경을 제공해야 한다."],a:0,e:"UI 설계는 조작 방법을 단순화하고 일관성을 유지해야 한다. 다양화는 복잡성을 높인다."},
{n:14,s:"소프트웨어 설계",q:"UI 설계 원칙에서 누구나 쉽게 이해하고 사용할 수 있어야 한다는 것은?",o:["유효성","직관성","학습성","유연성"],a:1,e:"직관성(Intuitiveness): 누구나 쉽게 이해하고 사용할 수 있어야 한다는 UI 설계 원칙."},
{n:15,s:"소프트웨어 설계",q:"디자인 패턴 사용의 장단점에 대한 설명으로 거리가 먼 것은?",o:["소프트웨어 구조 파악이 용이하다.","초기 투자 비용 및 개발 시간이 절약된다.","재사용을 위한 개발 시간이 단축된다.","객체지향 설계 및 구현의 생산성을 높이는데 적합하다."],a:1,e:"디자인 패턴 적용 초기에는 오히려 투자 비용과 개발 시간이 증가할 수 있다."},
{n:16,s:"소프트웨어 설계",q:"UML에서 시퀀스 다이어그램의 구성 항목에 해당하지 않는 것은?",o:["생명선","실행","확장","메시지"],a:2,e:"시퀀스 다이어그램 구성: 생명선(Lifeline), 실행(Activation), 메시지(Message), 객체(Object). 확장은 유스케이스 다이어그램의 관계이다."},
{n:17,s:"소프트웨어 설계",q:"소프트웨어 설계에서 각 모듈의 세분화된 역할이나 모듈들 간의 인터페이스와 같은 코드를 작성하는 수준의 세부적인 구현 방안을 설계할 때 참조할 수 있는 전형적인 해결 방식 또는 예제를 의미하는 것은?",o:["모듈 분해","클래스 도출","연관 관계","디자인 패턴"],a:3,e:"디자인 패턴: 소프트웨어 설계 시 자주 발생하는 문제에 대한 일반적이고 반복적인 해결 방법."},
{n:18,s:"소프트웨어 설계",q:"소프트웨어 모델링과 관련한 설명으로 틀린 것은?",o:["모델링 작업의 결과물은 다른 모델링 작업에 영향을 줄 수 없다.","구조적 방법론에서는 DFD, DD 등을 사용하여 요구사항의 결과를 표현한다.","객체지향 방법론에서는 UML 표기법을 사용한다.","소프트웨어 모델을 사용할 경우 이해도 및 의사소통 향상에 도움이 된다."],a:0,e:"모델링 작업의 결과물은 다른 모델링 작업에 영향을 줄 수 있다."},
{n:19,s:"소프트웨어 설계",q:"UML 모델에서 사용하는 구조적 다이어그램에 속하지 않은 것은?",o:["State Diagram","Object Diagram","Component Diagram","Class Diagram"],a:0,e:"State Diagram은 행위(동적) 다이어그램이다. 구조적 다이어그램: Class, Object, Component, Deployment, Package 등"},
{n:20,s:"소프트웨어 설계",q:"객체 지향 개념 중 하나 이상의 유사한 객체들을 묶어 공통된 특성을 표현한 데이터 추상화를 의미하는 것은?",o:["Method","Class","Field","Message"],a:1,e:"클래스(Class): 하나 이상의 유사한 객체들을 묶어 공통된 특성(속성+메서드)을 표현한 추상화 단위."},
// 제2과목 소프트웨어 개발
{n:21,s:"소프트웨어 개발",q:"소스 코드 품질 분석 도구 중 정적 분석 도구가 아닌 것은?",o:["pmd","cppcheck","valMeter","checkstyle"],a:2,e:"valMeter는 동적 분석 도구이다. 정적 분석 도구: pmd, cppcheck, checkstyle, SonarQube 등"},
{n:22,s:"소프트웨어 개발",q:"White Box Testing에 대한 설명으로 옳지 않은 것은?",o:["Base Path Testing, Boundary Value Analysis가 대표적인 기법이다.","Source Code의 모든 문장을 한 번 이상 수행함으로써 진행된다.","모듈 안의 작동을 직접 관찰할 수 있다.","산출물의 각 기능별로 적절한 프로그램의 제어 구조에 따라 선택, 반복 등의 부분들을 수행함으로써 논리적 경로를 점검한다."],a:0,e:"Boundary Value Analysis(경계값 분석)는 블랙박스 테스트 기법이다. 화이트박스: Base Path Testing, 조건 검사, 루프 검사 등."},
{n:23,s:"소프트웨어 개발",q:"소프트웨어 테스트에서 오류의 80%는 전체 모듈의 20% 내에서 발견된다는 법칙은?",o:["Brooks의 법칙","Boehm의 법칙","Pareto의 법칙","Jackson의 법칙"],a:2,e:"파레토 법칙(Pareto): 소프트웨어 테스트에서 오류의 80%는 전체 모듈의 20% 내에서 발견된다."},
{n:24,s:"소프트웨어 개발",q:"다음 트리의 차수(degree)는?\n\n        A\n       / \\\n      B   C\n    / | \\   \\\n   D  E  F   G\n        / \\\n       H   I",o:["2","3","4","5"],a:1,e:"트리의 차수 = 노드 중 최대 차수. 노드 B의 자식이 D, E, F로 3개이므로 트리의 차수는 3이다."},
{n:25,s:"소프트웨어 개발",q:"다음 트리를 Preorder 운행법으로 운행할 경우 가장 먼저 탐색되는 것은?\n\n      A\n     / \\\n    B   C\n   / \\   \\\n  D   E   F\n     / \\\n    G   H",o:["A","B","D","G"],a:0,e:"Preorder(전위 순회): 루트 → 왼쪽 → 오른쪽. 가장 먼저 루트 노드 A를 탐색한다."},
{n:26,s:"소프트웨어 개발",q:"인터페이스 보안을 위해 네트워크 영역에 적용될 수 있는 솔루션과 거리가 먼 것은?",o:["IPSec","SSL","SMTP","S-HTTP"],a:2,e:"SMTP는 이메일 전송 프로토콜이다. 보안 솔루션이 아니다. IPSec, SSL, S-HTTP는 보안 프로토콜이다."},
{n:27,s:"소프트웨어 개발",q:"저작권 관리 구성 요소에 대한 설명이 틀린 것은?",o:["콘텐츠 제공자(Contents Provider): 콘텐츠를 제공하는 저작권자","콘텐츠 분배자(Contents Distributor): 콘텐츠를 메타 데이터와 함께 배포 가능한 단위로 묶는 기능","클리어링 하우스(Clearing House): 키 관리 및 라이선스 발급 관리","DRM 컨트롤러: 배포된 콘텐츠의 이용 권한을 통제"],a:1,e:"콘텐츠를 메타 데이터와 함께 배포 가능한 단위로 묶는 것은 콘텐츠 패키저(Contents Packager)의 역할이다."},
{n:28,s:"소프트웨어 개발",q:"소프트웨어 설치 매뉴얼에 대한 설명으로 틀린 것은?",o:["설치 과정에서 표시될 수 있는 예외상황에 관련 내용을 별도로 구분하여 설명한다.","설치 시작부터 완료할 때까지의 전 과정을 빠짐없이 순서대로 설명한다.","설치 매뉴얼은 개발자 기준으로 작성한다.","설치 매뉴얼에는 목차, 개요, 기본사항 등이 기본적으로 포함되어야 한다."],a:2,e:"설치 매뉴얼은 사용자(최종 사용자) 기준으로 작성한다."},
{n:29,s:"소프트웨어 개발",q:"다음 중 블랙박스 검사 기법은?",o:["경계값 분석","조건 검사","기초 경로 검사","루프 검사"],a:0,e:"경계값 분석(Boundary Value Analysis)은 블랙박스 테스트 기법이다. 조건 검사, 기초 경로 검사, 루프 검사는 화이트박스 테스트 기법이다."},
{n:30,s:"소프트웨어 개발",q:"스택에 대한 설명으로 틀린 것은?",o:["입출력이 한쪽 끝으로만 제한된 리스트이다.","Head(front)와 Tail(rear)의 2개 포인터를 갖고 있다.","LIFO 구조이다.","더 이상 삭제할 데이터가 없는 상태에서 데이터를 삭제하면 언더플로(Underflow)가 발생한다."],a:1,e:"Head(front)와 Tail(rear) 2개의 포인터를 갖는 것은 큐(Queue)이다. 스택은 Top 포인터 1개만 사용한다."},
{n:31,s:"소프트웨어 개발",q:"디지털 저작권 관리(DRM)에 사용되는 기술 요소가 아닌 것은?",o:["키 관리","방화벽","암호화","크랙방지"],a:1,e:"방화벽(Firewall)은 네트워크 보안 도구이지 DRM 기술 요소가 아니다. DRM 기술 요소: 암호화, 키 관리, 크랙방지, 인증 등"},
{n:32,s:"소프트웨어 개발",q:"버전 관리 항목 중 저장소에 새로운 버전의 파일로 갱신하는 것을 의미하는 용어는?",o:["형상 감사(Configuration Audit)","롤백(Rollback)","단위 테스트(Unit Test)","체크인(Check-In)"],a:3,e:"체크인(Check-In): 저장소에 수정된 파일을 새로운 버전으로 등록하는 것."},
{n:33,s:"소프트웨어 개발",q:"정렬된 N개의 데이터를 처리하는 데 O(NlogN)의 시간이 소요되는 정렬 알고리즘은?",o:["합병 정렬","버블 정렬","선택 정렬","삽입 정렬"],a:0,e:"합병 정렬(Merge Sort): O(NlogN). 버블, 선택, 삽입 정렬: O(N²)."},
{n:34,s:"소프트웨어 개발",q:"클린 코드 작성 원칙에 대한 설명으로 틀린 것은?",o:["코드의 중복을 최소화 한다.","코드가 다른 모듈에 미치는 영향을 최대화하도록 작성한다.","누구든지 코드를 쉽게 읽을 수 있도록 작성한다.","간단하게 코드를 작성한다."],a:1,e:"클린 코드는 다른 모듈에 미치는 영향을 최소화(낮은 결합도)해야 한다."},
{n:35,s:"소프트웨어 개발",q:"테스트 케이스 자동 생성 도구를 이용하여 테스트 데이터를 찾아내는 방법이 아닌 것은?",o:["스터브(Stub)와 드라이버(Driver)","입력 도메인 분석","랜덤(Random) 테스트","자료 흐름도"],a:0,e:"스터브와 드라이버는 통합 테스트를 위한 보조 모듈이다. 테스트 케이스 자동 생성 방법이 아니다."},
{n:36,s:"소프트웨어 개발",q:"순서가 A, B, C, D로 정해진 입력 자료를 스택에 입력한 후 출력한 결과로 불가능한 것은?",o:["D, C, B, A","B, C, D, A","C, B, A, D","D, B, C, A"],a:3,e:"D를 출력하려면 A,B,C,D를 모두 push해야 한다. 이후 스택 top은 C이므로 B를 C보다 먼저 출력하는 것은 불가능하다."},
{n:37,s:"소프트웨어 개발",q:"프로젝트에 내재된 위험 요소를 인식하고 그 영향을 분석하여 이를 관리하는 활동으로서, 위험 요소를 사전에 예측, 대비하는 모든 기술과 활동을 포함하는 것은?",o:["Critical Path Method","Risk Analysis","Work Breakdown Structure","Waterfall Model"],a:1,e:"위험 분석(Risk Analysis): 프로젝트의 잠재적 위험을 식별하고 관리하는 활동."},
{n:38,s:"소프트웨어 개발",q:"인터페이스 간의 통신을 위해 이용되는 데이터 포맷이 아닌 것은?",o:["AJTML","JSON","XML","YAML"],a:0,e:"AJTML은 존재하지 않는 포맷이다. 인터페이스 통신 데이터 포맷: JSON, XML, YAML, CSV 등"},
{n:39,s:"소프트웨어 개발",q:"정형 기술 검토(FTR)의 지침으로 틀린 것은?",o:["의제를 제한한다.","논쟁과 반박을 제한한다.","문제 영역을 명확히 표현한다.","참가자의 수를 제한하지 않는다."],a:3,e:"FTR은 효율적인 검토를 위해 참가자의 수를 제한해야 한다(보통 3~5명)."},
{n:40,s:"소프트웨어 개발",q:"테스트와 디버그의 목적으로 옳은 것은?",o:["테스트는 오류를 수정하는 작업이고 디버깅은 오류를 찾는 작업이다.","둘 다 소프트웨어 오류의 발견, 수정과 무관하다.","테스트는 오류를 찾는 작업이고 디버깅은 오류를 수정하는 작업이다.","둘 다 소프트웨어의 오류를 찾는 작업으로 오류 수정은 하지 않는다."],a:2,e:"테스트(Test): 오류를 찾는 작업 / 디버깅(Debugging): 오류를 수정하는 작업"},
// 제3과목 데이터베이스 구축
{n:41,s:"데이터베이스 구축",q:"데이터 제어 언어(DCL)의 기능으로 옳지 않은 것은?",o:["데이터 보안","논리적, 물리적 데이터 구조 정의","무결성 유지","병행수행 제어"],a:1,e:"데이터 구조 정의는 DDL(Data Definition Language)의 기능이다. DCL 기능: 보안, 무결성, 병행수행 제어, 회복."},
{n:42,s:"데이터베이스 구축",q:"병행제어의 로킹(Locking) 단위에 대한 설명으로 옳지 않은 것은?",o:["데이터베이스, 파일, 레코드 등은 로킹 단위가 될 수 있다.","로킹 단위가 작아지면 로킹 오버헤드가 감소한다.","로킹 단위가 작아지면 데이터베이스 공유도가 증가한다.","한꺼번에 로킹할 수 있는 객체의 크기를 로킹 단위라고 한다."],a:1,e:"로킹 단위가 작아지면 더 많은 잠금을 관리해야 하므로 로킹 오버헤드가 증가한다."},
{n:43,s:"데이터베이스 구축",q:"이행적 함수 종속 관계를 의미하는 것은?",o:["A→B이고 B→C일 때, A→C를 만족하는 관계","A→B이고 B→C일 때, C→A를 만족하는 관계","A→B이고 B→C일 때, B→A를 만족하는 관계","A→B이고 B→C일 때, C→B를 만족하는 관계"],a:0,e:"이행적 함수 종속: A→B이고 B→C이면 A→C가 성립. 3NF는 이행적 종속을 제거한 정규형이다."},
{n:44,s:"데이터베이스 구축",q:"SQL의 분류 중 DDL에 해당하지 않는 것은?",o:["UPDATE","ALTER","DROP","CREATE"],a:0,e:"DDL(데이터 정의어): CREATE, ALTER, DROP, TRUNCATE / DML(데이터 조작어): SELECT, INSERT, UPDATE, DELETE"},
{n:45,s:"데이터베이스 구축",q:"데이터베이스 로그(log)를 필요로 하는 회복 기법은?",o:["즉각 갱신 기법","대수적 코딩 방법","타임 스탬프 기법","폴딩 기법"],a:0,e:"즉각 갱신 기법(Immediate Update): 트랜잭션 중 갱신 결과를 즉시 DB에 반영하며 로그를 필요로 한다."},
{n:46,s:"데이터베이스 구축",q:"Commit과 Rollback 명령어에 의해 보장 받는 트랜잭션의 특성은?",o:["병행성","보안성","원자성","로그"],a:2,e:"원자성(Atomicity): 트랜잭션은 전부 실행(Commit)되거나 전혀 실행되지 않아야(Rollback) 한다."},
{n:47,s:"데이터베이스 구축",q:"한 릴레이션 스키마가 4개 속성, 2개 후보키 그리고 그 스키마의 대응 릴레이션 인스턴스가 7개 튜플을 갖는다면 그 릴레이션의 차수(Degree)는?",o:["1","2","4","7"],a:2,e:"차수(Degree) = 속성(Attribute)의 수 = 4 / 카디널리티(Cardinality) = 튜플(Tuple)의 수 = 7"},
{n:48,s:"데이터베이스 구축",q:"사용자 X1에게 department 테이블에 대한 검색 연산을 회수하는 명령은?",o:["delete select on department to X1;","remove select on department from X1;","revoke select on department from X1;","grant select on department from X1;"],a:2,e:"권한 회수: REVOKE 권한 ON 객체 FROM 사용자 / 권한 부여: GRANT 권한 ON 객체 TO 사용자"},
{n:49,s:"데이터베이스 구축",q:"개체-관계 모델의 E-R 다이어그램에서 사용되는 기호와 그 의미의 연결이 틀린 것은?",o:["마름모 - 관계 타입","선 - 개체 타입과 속성을 연결","사각형 - 개체 타입","삼각형 - 속성"],a:3,e:"E-R 다이어그램에서 속성은 타원(Ellipse)으로 표시한다. 삼각형은 사용되지 않는다."},
{n:50,s:"데이터베이스 구축",q:"3NF에서 BCNF가 되기 위한 조건은?",o:["이행적 함수 종속 제거","부분적 함수 종속 제거","다치 종속 제거","결정자이면서 후보키가 아닌 것 제거"],a:3,e:"정규화: 1NF→2NF(부분 종속 제거)→3NF(이행 종속 제거)→BCNF(결정자이면서 후보키 아닌 것 제거)"},
{n:51,s:"데이터베이스 구축",q:"뷰(VIEW)에 대한 설명으로 옳지 않은 것은?",o:["DBA는 보안 측면에서 뷰를 활용할 수 있다.","뷰 위에 또 다른 뷰를 정의할 수 있다.","뷰에 대한 삽입, 갱신, 삭제 연산 시 제약사항이 따르지 않는다.","독립적인 인덱스를 가질 수 없다."],a:2,e:"뷰에 대한 삽입, 갱신, 삭제 연산에는 제약사항이 따른다 (예: 집계함수 포함 뷰, 그룹화된 뷰 등은 수정 불가)."},
{n:52,s:"데이터베이스 구축",q:"다음 릴레이션의 카디널리티와 차수가 옳게 나타낸 것은?\n(행: yuyu01/원유철/36/3/2000/2008, sykim10/김성일/29/2/3300/2014, kshan4/한경선/45/3/2800/2009, namsu52/이남수/33/5/1000/2016)",o:["카디널리티: 4, 차수: 4","카디널리티: 4, 차수: 6","카디널리티: 6, 차수: 4","카디널리티: 6, 차수: 6"],a:1,e:"카디널리티(Cardinality) = 튜플(행)의 수 = 4 / 차수(Degree) = 속성(열)의 수 = 6"},
{n:53,s:"데이터베이스 구축",q:"다음 SQL 문에서 ( ) 안에 들어갈 내용으로 옳은 것은?\n\nUPDATE 인사급여 ( ) 호봉 = 15\nWHERE 성명 = '홍길동';",o:["SET","FROM","INTO","IN"],a:0,e:"UPDATE 문 형식: UPDATE 테이블명 SET 컬럼명 = 값 WHERE 조건"},
{n:54,s:"데이터베이스 구축",q:"병행제어 기법의 종류가 아닌 것은?",o:["로킹 기법","시분할 기법","타임 스탬프 기법","다중 버전 기법"],a:1,e:"병행제어 기법: 로킹, 타임 스탬프, 낙관적 병행제어, 다중 버전 기법. 시분할은 CPU 스케줄링 기법이다."},
{n:55,s:"데이터베이스 구축",q:"SQL의 논리 연산자가 아닌 것은?",o:["AND","OTHER","OR","NOT"],a:1,e:"SQL 논리 연산자: AND, OR, NOT. OTHER는 SQL 연산자가 아니다."},
{n:56,s:"데이터베이스 구축",q:"관계대수에 대한 설명으로 틀린 것은?",o:["원하는 릴레이션을 정의하는 방법을 제공하며 비절차적 언어이다.","릴레이션 조작을 위한 연산의 집합으로 피연산자와 결과가 모두 릴레이션이다.","일반 집합 연산과 순수 관계 연산으로 구분된다.","질의에 대한 해를 구하기 위해 수행해야 할 연산의 순서를 명시한다."],a:0,e:"관계대수(Relational Algebra)는 절차적 언어이다. 비절차적 언어는 관계해석(Relational Calculus)이다."},
{n:57,s:"데이터베이스 구축",q:"SQL문에서 HAVING을 사용할 수 있는 절은?",o:["LIKE 절","WHERE 절","GROUP BY 절","ORDER BY 절"],a:2,e:"HAVING은 GROUP BY 절과 함께 사용하며, 그룹에 대한 조건을 지정한다."},
{n:58,s:"데이터베이스 구축",q:"데이터베이스의 무결성 규정(Integrity Rule)과 관련한 설명으로 틀린 것은?",o:["무결성 규정에는 데이터가 만족해야 될 제약 조건, 규정을 참조할 때 사용하는 식별자 등의 요소가 포함될 수 있다.","무결성 규정의 대상으로는 도메인, 키, 종속성 등이 있다.","정식으로 허가받은 사용자가 아닌 불법적인 사용자에 의한 갱신으로부터 데이터베이스를 보호하기 위한 규정이다.","릴레이션 무결성 규정은 릴레이션을 조작하는 과정에서의 의미적 관계를 명세한 것이다."],a:2,e:"③은 무결성이 아닌 보안(Security)에 관한 설명이다. 무결성은 데이터의 정확성과 일관성을 유지하는 것이다."},
{n:59,s:"데이터베이스 구축",q:"분산 데이터베이스 시스템에 대한 설명으로 틀린 것은?",o:["분산 데이터베이스는 논리적으로는 하나의 시스템에 속하지만 물리적으로는 여러 개의 컴퓨터 사이트에 분산되어 있다.","위치 투명성, 중복 투명성, 병행 투명성, 장애 투명성을 목표로 한다.","데이터베이스의 설계가 비교적 어렵고, 개발 비용과 처리 비용이 증가한다는 단점이 있다.","분산 데이터베이스 시스템의 주요 구성 요소는 분산 처리기, P2P 시스템, 단일 데이터베이스 등이 있다."],a:3,e:"분산 데이터베이스의 주요 구성 요소: 분산 처리기, 분산 데이터베이스, 통신 네트워크. P2P 시스템이나 단일 데이터베이스는 아니다."},
{n:60,s:"데이터베이스 구축",q:"CREATE TABLE 문에 포함되지 않는 기능은?",o:["속성 타입 변경","속성의 NOT NULL 여부 지정","기본키를 구성하는 속성 지정","CHECK 제약조건의 정의"],a:0,e:"속성 타입 변경은 ALTER TABLE 문을 사용한다. CREATE TABLE은 테이블 생성 시 사용한다."},
// 제4과목 프로그래밍 언어 활용
{n:61,s:"프로그래밍 언어 활용",q:"IP 주소체계와 관련한 설명으로 틀린 것은?",o:["IPv6의 패킷 헤더는 32 octet의 고정된 길이를 가진다.","IPv6는 주소 자동설정(Auto Configuration) 기능을 통해 손쉽게 이용자의 단말을 네트워크에 접속시킬 수 있다.","IPv4는 호스트 주소를 자동으로 설정하며 유니캐스트(Unicast)를 지원한다.","IPv4는 클래스별로 네트워크와 호스트 주소의 길이가 다르다."],a:0,e:"IPv6의 패킷 헤더는 40 octet(320 bit)의 고정된 길이를 가진다."},
{n:62,s:"프로그래밍 언어 활용",q:"효과적인 모듈 설계를 위한 유의사항으로 거리가 먼 것은?",o:["모듈 간의 결합도를 강하게 하면 모듈 독립성이 향상된다.","복잡도와 중복성을 줄이고 일관성을 유지시킨다.","모듈의 기능은 예측이 가능해야 한다.","유지보수가 용이해야 한다."],a:0,e:"모듈 독립성을 높이려면 결합도를 약하게(낮게), 응집도를 강하게(높게) 해야 한다."},
{n:63,s:"프로그래밍 언어 활용",q:"다음 C 언어 프로그램이 실행되었을 때, 실행 결과는?\n\nstruct st { int a; int c[10]; };\nob1.a=0; ob2.a=0;\nfor(i=0;i<10;i++) { ob1.c[i]=i; ob2.c[i]=ob1.c[i]+i; }\nfor(i=0;i<10;i=i+2) { ob1.a+=ob1.c[i]; ob2.a+=ob2.c[i]; }\nprintf(\"%d\", ob1.a+ob2.a);",o:["30","60","80","120"],a:1,e:"i=0,2,4,6,8일 때: ob1.a = 0+2+4+6+8=20, ob2.c[i]=2i이므로 ob2.a=0+4+8+12+16=40. 합계=60"},
{n:64,s:"프로그래밍 언어 활용",q:"다음 중 C 언어에서 우선순위가 가장 높은 것은?",o:["비트 연산자","시프트 연산자","관계 연산자","산술 연산자"],a:3,e:"C 연산자 우선순위(높은 순): 단항 > 산술(*/%) > 산술(+-) > 시프트 > 관계 > 비트 > 논리"},
{n:65,s:"프로그래밍 언어 활용",q:"다음 파이썬 코드에서 '53t44'를 입력했을 때 출력 결과는?\n\na, b = map(int, input().split(\"t\"))\nprint(a, b)",o:["53 t 44","53t44","53 44","53, 44"],a:2,e:"'53t44'.split('t') → ['53','44'], map(int,...) → a=53, b=44, print(a, b) → '53 44'"},
{n:66,s:"프로그래밍 언어 활용",q:"흐름 제어(Flow Control)에 대한 설명으로 옳지 않은 것은?",o:["정지-대기는 수신 측의 확인 신호(ACK)를 받은 후에 다음 패킷을 전송하는 방식이다.","확인 신호를 이용하여 송신 데이터의 양을 조절하는 방식은 슬라이딩 윈도우이다.","확인 신호 없이 보낼 수 있는 패킷의 최대치가 윈도우 크기이다.","이전에 송신한 패킷에 대한 부정 수신 응답(NAK)이 전달된 경우 윈도우 크기가 증가한다."],a:3,e:"NAK을 받으면 윈도우 크기가 감소하고 해당 패킷을 재전송한다."},
{n:67,s:"프로그래밍 언어 활용",q:"다음 C 언어 프로그램이 실행되었을 때의 결과는?\n\nint n = 4;\nint* pt = NULL;\npt = &n;\nprintf(\"%d\", &n + *pt - *&pt + n);",o:["0","4","8","12"],a:2,e:"*pt=4, *&pt=pt=&n이므로: &n + 4 - &n + 4 = 8"},
{n:68,s:"프로그래밍 언어 활용",q:"커널의 버전을 확인할 때 사용하는 리눅스 명령어는?",o:["chmod","ls","rm","uname"],a:3,e:"uname: 시스템 정보(커널 버전 등)를 출력하는 리눅스 명령어. 'uname -r'로 커널 버전 확인."},
{n:69,s:"프로그래밍 언어 활용",q:"지역성(Locality)의 종류 중 시간 구역성(Temporal Locality)에 해당하지 않는 것은?",o:["루프","서브루틴","배열 순회","스택"],a:2,e:"시간 구역성: 최근 사용된 데이터가 가까운 미래에 다시 사용될 가능성(루프, 서브루틴, 스택). 배열 순회는 공간 구역성(Spatial Locality)."},
{n:70,s:"프로그래밍 언어 활용",q:"다음 C언어 프로그램이 실행되었을 때의 결과는?\n\nchar* s = \"Sinagong\";\nfor (int i = 5; i > 0; i--)\n    printf(\"%c\", *(s + i));",o:["inago","ogani","sinagong","gnoganis"],a:1,e:"s[5]='o', s[4]='g', s[3]='a', s[2]='n', s[1]='i' → 'ogani'"},
{n:71,s:"프로그래밍 언어 활용",q:"OSI 7계층 모델에서 전송에 필요한 장치 간의 실제 접속과 절단 등 기계적, 전기적, 기능적, 절차적 특성을 정의한 계층은?",o:["물리 계층","데이터 링크 계층","네트워크 계층","전송 계층"],a:0,e:"물리 계층(Physical Layer): 전기적·기계적 특성을 정의하는 OSI 1계층."},
{n:72,s:"프로그래밍 언어 활용",q:"다음 자바 코드를 실행한 결과는?\n\nint x=1, y=6;\nwhile (y--) {\n    x++;\n}\nSystem.out.println(\"x=\" + x + \"y=\" + y);",o:["x=7 y=0","x=6 y=-1","x=7 y=-1","Unresolved compilation problem 오류 발생"],a:3,e:"Java에서 while 조건식은 boolean 타입이어야 한다. 'y--'는 int를 반환하므로 컴파일 오류가 발생한다."},
{n:73,s:"프로그래밍 언어 활용",q:"UNIX에서 새로운 프로세스를 생성하는 명령어는?",o:["ls","cat","fork","chmod"],a:2,e:"fork(): UNIX에서 현재 프로세스를 복사하여 새로운 자식 프로세스를 생성하는 시스템 콜."},
{n:74,s:"프로그래밍 언어 활용",q:"128.107.176.0/22 네트워크에서 호스트에 의해 사용될 수 있는 서브넷 마스크는?",o:["255.0.0.0","255.248.0.0","255.255.252.0","255.255.255.255"],a:2,e:"/22는 상위 22비트가 네트워크. 11111111.11111111.11111100.00000000 = 255.255.252.0"},
{n:75,s:"프로그래밍 언어 활용",q:"다음 C 언어 프로그램이 실행되었을 때 결과는?\n\nchar str1[20]=\"KOREA\", str2[20]=\"LOVE\";\nchar *p1=str1, *p2=str2;\nstr1[1]=p2[2]; str2[3]=p1[4];\nstrcat(str1, str2);\nprintf(\"%c\", *(p1+2));",o:["E","V","R","O"],a:2,e:"str1[1]=p2[2]='V'→str1='KVREA', str2[3]=p1[4]='A'→str2='LOVA'. *(p1+2)=str1[2]='R'"},
{n:76,s:"프로그래밍 언어 활용",q:"다음과 같은 세그먼트 테이블에서 논리 주소(2, 176)에 대한 물리 주소는?\n(세그먼트2: 시작주소 222, 길이 198)",o:["398","400","1928","1930"],a:0,e:"물리 주소 = 시작주소 222 + 오프셋 176 = 398 (오프셋 176 < 길이 198이므로 유효)"},
{n:77,s:"프로그래밍 언어 활용",q:"스크립트(Script) 언어가 아닌 것은?",o:["PHP","Fortran","Basic","Python"],a:1,e:"Fortran은 컴파일 언어이다. PHP, Basic, Python은 스크립트 언어이다."},
{n:78,s:"프로그래밍 언어 활용",q:"한 모듈이 다른 모듈의 내부 기능 및 그 내부 자료를 참조하는 경우의 결합도는?",o:["내용 결합도(Content Coupling)","제어 결합도(Control Coupling)","공통 결합도(Common Coupling)","스탬프 결합도(Stamp Coupling)"],a:0,e:"결합도 강도(강→약): 내용 > 공통 > 외부 > 제어 > 스탬프 > 자료"},
{n:79,s:"프로그래밍 언어 활용",q:"파일 디스크립터(File Descriptor)에 대한 설명으로 틀린 것은?",o:["파일 관리를 위해 시스템이 필요로 하는 정보를 가지고 있다.","파일 제어 블록(File Control Block)이라고도 한다.","사용자가 파일 디스크립터를 직접 참조할 수 없다.","주기억장치에 저장되어 있다가 파일이 개방(open)되면 보조기억장치로 이동된다."],a:3,e:"파일 디스크립터는 보조기억장치에 저장되어 있다가 open 시 주기억장치로 이동된다. ④는 반대로 설명하고 있다."},
{n:80,s:"프로그래밍 언어 활용",q:"C 언어 라이브러리 중 stdlib.h에 대한 설명으로 옳은 것은?",o:["문자열을 수치 데이터로 바꾸는 문자 변환 함수와 수치를 문자열로 바꿔주는 변환 함수 등이 있다.","문자열 처리 함수로 strlen()이 포함되어 있다.","표준 입출력 라이브러리이다.","삼각 함수, 제곱근, 지수 등 수학적인 함수를 내장하고 있다."],a:0,e:"stdlib.h: 수치 변환(atoi, atof), 동적 메모리 할당(malloc, free), 난수(rand) 등. strlen()→string.h, 입출력→stdio.h, 수학→math.h"},
// 제5과목 정보시스템 구축 관리
{n:81,s:"정보시스템 구축 관리",q:"데이터의 송수신 사실을 증명할 수 있도록 송수신 증거를 제공해야 한다는 보안 요소는?",o:["기밀성","무결성","가용성","부인 방지"],a:3,e:"부인 방지(Non-repudiation): 메시지 전송·수신 사실을 부인할 수 없도록 증거를 제공하는 보안 요소."},
{n:82,s:"정보시스템 구축 관리",q:"악성코드의 유형 중 다른 컴퓨터의 취약점을 이용하여 스스로 전파하거나 메일로 전파되며 스스로를 증식하는 것은?",o:["Worm","Rogue Ware","Adware","Reflection Attack"],a:0,e:"웜(Worm): 자기 복제 능력을 갖고 네트워크를 통해 스스로 전파. 바이러스와 달리 숙주 파일 없이 독립적으로 동작."},
{n:83,s:"정보시스템 구축 관리",q:"다음 중 소프트웨어 비용 산정에 대한 설명으로 옳지 않은 것은?",o:["소프트웨어의 규모, 인력 등의 요소를 기반으로 개발에 필요한 비용을 예측하는 것이다.","소프트웨어 비용 산정 기법에는 상향식, 하향식, 혼합식 기법이 있다.","소프트웨어 비용을 높게 산정할 경우 예산 낭비와 일의 효율성 저하를 초래할 수 있다.","소프트웨어 비용 결정 요소에는 프로젝트 요소, 자원 요소, 생산성 요소가 있다."],a:1,e:"소프트웨어 비용 산정 기법은 하향식(Top-Down), 상향식(Bottom-Up)으로 분류한다."},
{n:84,s:"정보시스템 구축 관리",q:"프로젝트에 내재된 위험 요소를 인식하고 그 영향을 분석하여 이를 관리하는 활동은?",o:["Critical Path Method","Risk Analysis","Work Breakdown Structure","Waterfall Model"],a:1,e:"위험 분석(Risk Analysis): 프로젝트의 잠재적 위험을 식별하고 관리하는 활동."},
{n:85,s:"정보시스템 구축 관리",q:"국내 IT 서비스 경쟁력 강화를 목표로 개발된 개방형 클라우드 컴퓨팅 플랫폼은?",o:["N2OS","PaaS-TA","KAWS","Metaverse"],a:1,e:"PaaS-TA: 국내에서 개발한 개방형 클라우드 컴퓨팅 플랫폼."},

{n:88,s:"정보시스템 구축 관리",q:"COCOMO 모델의 프로젝트 유형으로 거리가 먼 것은?",o:["Organic","Semi-detached","Embedded","Sequential"],a:3,e:"COCOMO 모델의 프로젝트 유형: Organic(조직형), Semi-detached(반분리형), Embedded(내장형). Sequential은 없다."},

{n:90,s:"정보시스템 구축 관리",q:"다음 중 소프트웨어 개발 보안 생명주기 방법론이 아닌 것은?",o:["CLASP","SDL","PIMS","Seven Touchpoints"],a:2,e:"PIMS(Personal Information Management System)는 개인정보 보호 관리 체계이다. 소프트웨어 개발 보안 방법론: SDL, CLASP, Seven Touchpoints."},
{n:91,s:"정보시스템 구축 관리",q:"간트 차트(Gantt Chart)에 대한 설명으로 틀린 것은?",o:["프로젝트를 이루는 소작업별로 언제 시작되고 언제 끝나야 하는지를 한 눈에 볼 수 있도록 도와준다.","자원 배치 계획에 유용하게 사용된다.","CPM 네트워크로부터 만드는 것이 가능하다.","수평 막대의 길이는 각 작업(Task)에 필요한 인원수를 나타낸다."],a:3,e:"간트 차트에서 수평 막대의 길이는 작업 기간(Duration)을 나타낸다."},
{n:92,s:"정보시스템 구축 관리",q:"가상화를 적용하여 일정 조직 내 여러 스토리지를 하나처럼 관리하고 운용하는 IT 기술은?",o:["Software Defined Storage","Distribution Oriented Storage","Network Architected Storage","Systematic Network Storage"],a:0,e:"SDS(Software Defined Storage): 소프트웨어로 스토리지를 가상화하여 여러 스토리지를 하나처럼 관리."},
{n:93,s:"정보시스템 구축 관리",q:"다음 중 SQL의 집계 함수(Aggregation Function)가 아닌 것은?",o:["AVG","COUNT","SUM","CREATE"],a:3,e:"집계 함수(GROUP 함수): COUNT, SUM, AVG, MAX, MIN, STDDEV, VARIANCE. CREATE는 DDL 명령어이다."},
{n:94,s:"정보시스템 구축 관리",q:"TCP/IP 프로토콜 중 전송 계층 프로토콜은?",o:["HTTP","SMTP","FTP","TCP"],a:3,e:"TCP/IP의 전송 계층 프로토콜: TCP, UDP, RTCP. HTTP, SMTP, FTP는 응용 계층 프로토콜이다."},
{n:95,s:"정보시스템 구축 관리",q:"소프트웨어 개발 프레임워크를 적용할 경우 기대 효과로 거리가 먼 것은?",o:["품질 보증","시스템 복잡도 증가","개발 용이성","변경 용이성"],a:1,e:"소프트웨어 개발 프레임워크의 기대 효과: 품질 보증, 개발 용이성, 변경 용이성, 시스템 복잡도 감소."},
{n:96,s:"정보시스템 구축 관리",q:"블록 암호화 방식이 아닌 것은?",o:["DES","RC4","AES","SEED"],a:1,e:"개인키 암호화 기법 — 블록 암호화 방식: DES, SEED, AES, ARIA / 스트림 암호화 방식: LFSR, RC4"},
{n:97,s:"정보시스템 구축 관리",q:"CMM(Capability Maturity Model) 모델의 레벨로 옳지 않은 것은?",o:["최적 단계","관리 단계","계획 단계","정의 단계"],a:2,e:"CMMI 5단계: 초기(Initial) → 관리(Managed) → 정의(Defined) → 정량적 관리 → 최적화(Optimizing). '계획 단계'는 없다."},
{n:98,s:"정보시스템 구축 관리",q:"나선형(Spiral) 모형의 주요 태스크에 해당되지 않는 것은?",o:["버전 관리","위험 분석","개발","평가"],a:0,e:"나선형 모형의 주요 태스크: 계획 수립, 위험 분석, 개발 및 검증, 고객 평가. '버전 관리'는 아니다."},
{n:99,s:"정보시스템 구축 관리",q:"취약점 관리를 위해 일반적으로 수행하는 작업이 아닌 것은?",o:["무결성 검사","응용 프로그램의 보안 설정 및 패치(Patch) 적용","중단 프로세스 및 닫힌 포트 위주로 확인","불필요한 서비스 및 악성 프로그램의 확인과 제거"],a:2,e:"취약점 관리: 무결성 검사, 보안 설정 및 패치, 동작 중인 프로세스 및 열린 포트 확인, 로그 분석 등. 닫힌 포트가 아닌 열린 포트를 확인한다."},
{n:100,s:"정보시스템 구축 관리",q:"정보 보안의 3요소에 해당하지 않는 것은?",o:["기밀성","무결성","가용성","휘발성"],a:3,e:"정보 보안의 3대 요소: 기밀성(Confidentiality), 무결성(Integrity), 가용성(Availability). 휘발성은 보안 요소가 아니다."}
];

const PS=5;
let cp=0,ua={};
const ls=()=>{try{const d=localStorage.getItem('q1h');if(d)ua=JSON.parse(d);cp=parseInt(localStorage.getItem('q1hp')||'0');}catch(e){}};
const ss=()=>{try{localStorage.setItem('q1h',JSON.stringify(ua));localStorage.setItem('q1hp',String(cp));}catch(e){}};
const tp=()=>Math.ceil(Q.length/PS);
const gq=()=>Q.slice(cp*PS,(cp+1)*PS);

function upd(){
  let t=Object.keys(ua).length,c=0,w=0;
  Object.entries(ua).forEach(([k,v])=>{const q=Q.find(x=>String(x.n)===k);if(q){v===q.a?c++:w++;}});
  document.getElementById('st').textContent=t;
  document.getElementById('sc').textContent=c;
  document.getElementById('sw').textContent=w;
  document.getElementById('sr').textContent=Q.length-t;
  document.getElementById('pbar').style.width=(t/Q.length*100)+'%';
}

function render(){
  upd();
  const qs=gq(),nm=['①','②','③','④'];
  let h='';
  qs.forEach(q=>{
    const ans=ua[String(q.n)];
    const done=ans!==undefined;
    let qt=q.q.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const parts=qt.split('\n\n');
    h+=`<div class="qcard">`;
    h+=`<div class="qmeta"><span class="badge n">Q${q.n}</span><span class="badge">${q.s}</span></div>`;
    h+=`<div class="qtext">${parts[0]}</div>`;
    if(parts.length>1) h+=`<div class="code">${parts.slice(1).join('\n\n')}</div>`;
    h+=`<div class="opts">`;
    q.o.forEach((o,i)=>{
      let cl='opt';
      if(done){cl+=(i===q.a?' ok':(i===ans?' ng':' hi'));}
      h+=`<button class="${cl}" ${done?'disabled':''} onclick="sel(${q.n},${i})">${nm[i]} ${o.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</button>`;
    });
    h+='</div>';
    if(done&&q.e) h+=`<div class="explain">💡 ${q.e}</div>`;
    h+='</div>';
  });
  document.getElementById('qa').innerHTML=h;
  const t2=tp();
  document.getElementById('pi').textContent=`${cp+1} / ${t2} 페이지`;
  document.getElementById('bp').disabled=cp===0;
  const last=cp===t2-1;
  const bn=document.getElementById('bn');
  bn.textContent=last?'결과 보기 🏁':'다음 ▶';
  bn.onclick=last?showResult:()=>gp(1);
}

function sel(n,i){
  if(ua[String(n)]!==undefined)return;
  ua[String(n)]=i;ss();render();
}

function gp(d){
  const np=cp+d;
  if(np<0||np>=tp())return;
  cp=np;ss();render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function showResult(){
  document.getElementById('qa').style.display='none';
  document.querySelector('.nav').style.display='none';
  document.getElementById('rarea').style.display='block';
  let c=0;const wl=[];
  Q.forEach(q=>{const a=ua[String(q.n)];if(a===q.a)c++;else if(a!==undefined)wl.push(q);});
  const pct=Math.round(c/Q.length*100);
  document.getElementById('rsc').textContent=`${c} / ${Q.length}`;
  document.getElementById('rsb').textContent=`정답률 ${pct}%`;
  const rv=document.getElementById('rv');
  if(pct>=60){rv.textContent='🎉 합격권입니다! (60점 이상)';rv.className='verdict vp';}
  else{rv.textContent='📚 60점 미만 — 조금 더 공부가 필요해요!';rv.className='verdict vf';}
  if(wl.length>0){
    document.getElementById('wb').style.display='block';
    const nm=['①','②','③','④'];
    let wh='';
    wl.forEach(q=>{
      const my=ua[String(q.n)];
      wh+=`<div class="witem">`;
      wh+=`<div class="qmeta" style="margin-bottom:5px"><span class="badge n">Q${q.n}</span><span class="badge">${q.s}</span></div>`;
      wh+=`<div class="wq">${q.q.split('\n\n')[0].replace(/&/g,'&amp;').replace(/</g,'&lt;').substring(0,100)}...</div>`;
      wh+=`<div class="wa">내 답: <strong>${nm[my]} ${q.o[my].substring(0,30)}...</strong> → 정답: <strong style="color:#2a7d32">${nm[q.a]} ${q.o[q.a].substring(0,30)}...</strong></div>`;
      if(q.e) wh+=`<div class="wex">💡 ${q.e}</div>`;
      wh+='</div>';
    });
    document.getElementById('wl').innerHTML=wh;
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

function reset(){
  ua={};cp=0;ss();
  document.getElementById('qa').style.display='';
  document.querySelector('.nav').style.display='';
  document.getElementById('rarea').style.display='none';
  render();
}

ls();render();
window.addEventListener('beforeunload',ss);
</script>
